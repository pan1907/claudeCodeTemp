<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>松弛一刻 · 放空自己</title>
<meta name="description" content="一个让你放松身心的小站：慢节奏的轻动画与环境音，萤火、海浪、星夜、呼吸、落雪、落雨、昼夜。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05130f;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 切换场景时的黑场过渡 */
  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 5;
  }
  #fade.on { opacity: 1; }

  .ui {
    position: fixed;
    z-index: 10;
    transition: opacity 1.2s ease;
  }
  body.idle .ui { opacity: 0; }

  header.ui {
    top: 32px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    pointer-events: none;
  }
  header.ui h1 {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 10px;
    text-indent: 10px; /* 抵消最后一个字的字距，保证视觉居中 */
  }
  header.ui p {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.45);
  }

  nav.ui {
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.10);
    max-width: calc(100vw - 16px);
  }
  nav.ui button,
  #soundBtn {
    appearance: none;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    letter-spacing: 2px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.4s ease, color 0.4s ease;
    font-family: inherit;
    white-space: nowrap;
  }
  nav.ui button:hover, #soundBtn:hover { color: rgba(255, 255, 255, 0.85); }
  nav.ui button.active {
    background: rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.95);
  }

  #soundBtn {
    top: 28px;
    right: 28px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.10);
  }
  #soundBtn.on {
    background: rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.95);
  }

  #hint {
    bottom: 96px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }

  @media (max-width: 600px) {
    header.ui { top: 20px; }
    header.ui h1 { font-size: 17px; letter-spacing: 7px; text-indent: 7px; }
    nav.ui { bottom: 20px; gap: 0; padding: 4px; }
    nav.ui button { font-size: 12px; padding: 7px 7px; letter-spacing: 0; }
    #soundBtn { top: 16px; right: 12px; font-size: 12px; padding: 7px 12px; letter-spacing: 1px; }
    #hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="fade"></div>

<header class="ui">
  <h1>松弛一刻</h1>
  <p>停下来，看一会儿</p>
</header>

<div id="hint" class="ui">点击下方切换场景 · ← → 键 · 右上角开启声音</div>

<button id="soundBtn" class="ui">♪ 声音 关</button>

<nav class="ui" id="switcher"></nav>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const fadeEl = document.getElementById('fade');
  const switcher = document.getElementById('switcher');
  const soundBtn = document.getElementById('soundBtn');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scenes.forEach(s => s.inited && s.init());
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const lerpC = (c1, c2, k) => c1.map((v, i) => Math.round(lerp(v, c2[i], k)));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  function bgGradient(stops) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    stops.forEach(([p, c]) => g.addColorStop(p, c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* ================= 音频引擎（Web Audio 实时合成，无音频文件） ================= */
  const audio = {
    ctx: null, master: null, noiseBuf: null,
    handle: null, enabled: false,
    ensure() {
      if (this.ctx) return;
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    },
    noise() {
      const s = this.ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      s.loop = true;
      s.start();
      return s;
    },
    /* 一声蟋蟀：高频正弦的几个短脉冲 */
    cricket(out) {
      const c = this.ctx, t0 = c.currentTime;
      const osc = c.createOscillator();
      osc.frequency.value = rand(4000, 4600);
      const g = c.createGain();
      g.gain.value = 0;
      let tail = out;
      if (c.createStereoPanner) {
        const pan = c.createStereoPanner();
        pan.pan.value = rand(-0.8, 0.8);
        pan.connect(out);
        tail = pan;
      }
      osc.connect(g); g.connect(tail);
      const pulses = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < pulses; i++) {
        const tp = t0 + i * 0.075;
        g.gain.setValueAtTime(0, tp);
        g.gain.linearRampToValueAtTime(0.012, tp + 0.02);
        g.gain.linearRampToValueAtTime(0, tp + 0.06);
      }
      osc.start(t0);
      osc.stop(t0 + pulses * 0.075 + 0.1);
    },
    /* 一滴水声：窄带噪声的瞬间脉冲 */
    droplet(out) {
      const c = this.ctx, t0 = c.currentTime;
      const src = this.noise();
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = rand(2500, 5200);
      f.Q.value = 8;
      const g = c.createGain();
      g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(out);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(rand(0.015, 0.04), t0 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      src.stop(t0 + 0.15);
    },
    /* 持续的风/气流：低通噪声 + 缓慢漂移 */
    wind(out, { vol = 0.22, cutoff = 220 } = {}) {
      const c = this.ctx;
      const src = this.noise();
      const f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = cutoff;
      const g = c.createGain();
      g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(out);
      const lfo = c.createOscillator(); lfo.frequency.value = 0.05;
      const lg = c.createGain(); lg.gain.value = cutoff * 0.4;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.07;
      const lg2 = c.createGain(); lg2.gain.value = vol * 0.35;
      lfo2.connect(lg2); lg2.connect(g.gain); lfo2.start();
      return [src, lfo, lfo2];
    },
    toggle() {
      this.enabled = !this.enabled;
      if (this.enabled) {
        this.ensure();
        this.ctx.resume();
        this.play();
      } else {
        this.stopCurrent(0.8, true);
      }
      soundBtn.textContent = this.enabled ? '♪ 声音 开' : '♪ 声音 关';
      soundBtn.classList.toggle('on', this.enabled);
    },
    stopCurrent(fadeSec = 1.2, suspendAfter = false) {
      if (!this.handle) return;
      const h = this.handle;
      this.handle = null;
      const t0 = this.ctx.currentTime;
      h.out.gain.cancelScheduledValues(t0);
      h.out.gain.setValueAtTime(h.out.gain.value, t0);
      h.out.gain.linearRampToValueAtTime(0, t0 + fadeSec);
      setTimeout(() => {
        h.dispose && h.dispose();
        h.out.disconnect();
        if (suspendAfter && !this.enabled) this.ctx.suspend();
      }, fadeSec * 1000 + 100);
    },
    play() {
      if (!this.enabled || !this.ctx) return;
      this.stopCurrent();
      const scene = scenes[current];
      if (!scene.sound) return;
      const out = this.ctx.createGain();
      out.gain.value = 0;
      out.connect(this.master);
      const h = scene.sound(this, out) || {};
      h.out = out;
      out.gain.linearRampToValueAtTime(1, this.ctx.currentTime + 2);
      this.handle = h;
    },
    update(t, dt) {
      if (this.enabled && this.handle && this.handle.update) this.handle.update(t, dt);
    },
  };
  soundBtn.addEventListener('click', () => audio.toggle());

  const stopAll = nodes => nodes.forEach(n => { try { n.stop(); } catch (e) {} });

  /* ================= 场景一：萤火 ================= */
  const fireflies = {
    name: '萤火',
    flies: [],
    init() {
      this.inited = true;
      const n = Math.round(Math.min(60, W * H / 28000));
      this.flies = Array.from({ length: n }, () => ({
        x: rand(0, W), y: rand(0, H),
        r: rand(1.2, 2.8),
        a: rand(0, Math.PI * 2),
        va: rand(-0.3, 0.3),
        speed: rand(4, 12),
        phase: rand(0, Math.PI * 2),
        blink: rand(0.4, 1.2),
      }));
    },
    draw(dt, t) {
      bgGradient([[0, '#0d2420'], [0.6, '#081a16'], [1, '#04100d']]);
      const moon = ctx.createRadialGradient(W * 0.78, H * 0.22, 0, W * 0.78, H * 0.22, Math.min(W, H) * 0.4);
      moon.addColorStop(0, 'rgba(180, 220, 190, 0.07)');
      moon.addColorStop(1, 'rgba(180, 220, 190, 0)');
      ctx.fillStyle = moon;
      ctx.fillRect(0, 0, W, H);

      for (const f of this.flies) {
        f.a += f.va * dt;
        f.x += Math.cos(f.a) * f.speed * dt;
        f.y += Math.sin(f.a) * f.speed * dt;
        if (f.x < -20) f.x = W + 20; if (f.x > W + 20) f.x = -20;
        if (f.y < -20) f.y = H + 20; if (f.y > H + 20) f.y = -20;

        const glow = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * f.blink + f.phase));
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 7);
        g.addColorStop(0, `rgba(214, 255, 170, ${0.85 * glow})`);
        g.addColorStop(0.3, `rgba(190, 240, 140, ${0.35 * glow})`);
        g.addColorStop(1, 'rgba(190, 240, 140, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * 7, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    /* 夏夜：轻微的夜风 + 蟋蟀 */
    sound(A, out) {
      const nodes = A.wind(out, { vol: 0.08, cutoff: 260 });
      let next = 0;
      return {
        update(t) {
          if (t < next) return;
          next = t + rand(0.7, 2.2);
          A.cricket(out);
        },
        dispose() { stopAll(nodes); },
      };
    },
  };

  /* ================= 场景二：海浪 ================= */
  const waves = {
    name: '海浪',
    layers: [],
    init() {
      this.inited = true;
      this.layers = [
        { y: 0.62, amp: 18, len: 0.9, speed: 0.18, color: 'rgba(70, 110, 165, 0.45)' },
        { y: 0.70, amp: 22, len: 1.3, speed: -0.12, color: 'rgba(55, 90, 145, 0.55)' },
        { y: 0.78, amp: 26, len: 1.7, speed: 0.09, color: 'rgba(40, 70, 120, 0.70)' },
        { y: 0.86, amp: 30, len: 2.2, speed: -0.06, color: 'rgba(28, 50, 95, 0.90)' },
      ];
    },
    draw(dt, t) {
      bgGradient([[0, '#2b2a4e'], [0.45, '#473b66'], [0.62, '#8a5a78'], [1, '#1c3260']]);
      const sun = ctx.createRadialGradient(W * 0.5, H * 0.58, 0, W * 0.5, H * 0.58, Math.min(W, H) * 0.45);
      sun.addColorStop(0, 'rgba(255, 190, 140, 0.30)');
      sun.addColorStop(1, 'rgba(255, 190, 140, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, W, H);

      for (const l of this.layers) {
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 4) {
          const y = H * l.y
            + Math.sin((x / W) * Math.PI * 2 * l.len + t * l.speed * Math.PI * 2) * l.amp
            + Math.sin((x / W) * Math.PI * 2 * l.len * 2.3 + t * l.speed * 5) * l.amp * 0.25;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fillStyle = l.color;
        ctx.fill();
      }
    },
    /* 海浪：低频噪声，音量像潮水一样一阵阵起伏 */
    sound(A, out) {
      const c = A.ctx;
      const src = A.noise();
      const f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 420;
      const g = c.createGain();
      g.gain.value = 0.32;
      src.connect(f); f.connect(g); g.connect(out);
      const lfo1 = c.createOscillator(); lfo1.frequency.value = 0.07;
      const lg1 = c.createGain(); lg1.gain.value = 0.16;
      lfo1.connect(lg1); lg1.connect(g.gain); lfo1.start();
      const lfo2 = c.createOscillator(); lfo2.frequency.value = 0.043;
      const lg2 = c.createGain(); lg2.gain.value = 0.10;
      lfo2.connect(lg2); lg2.connect(g.gain); lfo2.start();
      return { dispose() { stopAll([src, lfo1, lfo2]); } };
    },
  };

  /* ================= 场景三：星夜 ================= */
  const stars = {
    name: '星夜',
    list: [],
    meteor: null,
    nextMeteor: 0,
    init() {
      this.inited = true;
      const n = Math.round(Math.min(220, W * H / 7000));
      this.list = Array.from({ length: n }, () => ({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.4, 1.6),
        phase: rand(0, Math.PI * 2),
        blink: rand(0.3, 1.0),
      }));
      this.nextMeteor = rand(3, 7);
    },
    draw(dt, t) {
      bgGradient([[0, '#060a1c'], [0.7, '#0a1130'], [1, '#141a3c']]);

      for (const s of this.list) {
        s.x += 1.2 * dt;
        if (s.x > W + 2) s.x = -2;
        const tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.blink + s.phase));
        ctx.fillStyle = `rgba(235, 240, 255, ${tw})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      this.nextMeteor -= dt;
      if (!this.meteor && this.nextMeteor <= 0) {
        this.meteor = { x: rand(W * 0.2, W * 0.9), y: rand(0, H * 0.3), life: 0 };
        this.nextMeteor = rand(6, 14);
      }
      if (this.meteor) {
        const m = this.meteor;
        m.life += dt;
        const p = m.life / 1.2;
        if (p >= 1) { this.meteor = null; }
        else {
          const len = 140, dx = -0.85, dy = 0.5;
          const x = m.x + dx * p * 300, y = m.y + dy * p * 300;
          const alpha = Math.sin(p * Math.PI) * 0.9;
          const g = ctx.createLinearGradient(x, y, x - dx * len, y - dy * len);
          g.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
          g.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.strokeStyle = g;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - dx * len, y - dy * len);
          ctx.stroke();
        }
      }
    },
    /* 星夜：极轻的低音长音，近乎寂静 */
    sound(A, out) {
      const c = A.ctx;
      const o1 = c.createOscillator(); o1.frequency.value = 96;
      const o2 = c.createOscillator(); o2.frequency.value = 144.5;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
      const g = c.createGain(); g.gain.value = 0.045;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(out);
      o1.start(); o2.start();
      const lfo = c.createOscillator(); lfo.frequency.value = 0.03;
      const lg = c.createGain(); lg.gain.value = 0.02;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      return { dispose() { stopAll([o1, o2, lfo]); } };
    },
  };

  /* ================= 场景四：呼吸 ================= */
  /* 4-4-6 呼吸法：吸气 4 秒，屏息 4 秒，呼气 6 秒 */
  const BREATH_PHASES = [
    { label: '吸 气', dur: 4, from: 0, to: 1 },
    { label: '屏 息', dur: 4, from: 1, to: 1 },
    { label: '呼 气', dur: 6, from: 1, to: 0 },
  ];
  function breathState(t) {
    const total = BREATH_PHASES.reduce((s, p) => s + p.dur, 0);
    let tt = t % total, phase = BREATH_PHASES[0];
    for (const p of BREATH_PHASES) {
      if (tt < p.dur) { phase = p; break; }
      tt -= p.dur;
    }
    const lin = tt / phase.dur;
    const eased = lin < 0.5 ? 2 * lin * lin : 1 - Math.pow(-2 * lin + 2, 2) / 2;
    return { label: phase.label, remain: phase.dur - tt, k: phase.from + (phase.to - phase.from) * eased };
  }

  const breath = {
    name: '呼吸',
    init() { this.inited = true; },
    draw(dt, t) {
      bgGradient([[0, '#13343b'], [0.6, '#0e272e'], [1, '#081a20']]);

      const { label, remain, k } = breathState(t);
      const cx = W / 2, cy = H / 2;
      const rMin = Math.min(W, H) * 0.10;
      const rMax = Math.min(W, H) * 0.22;
      const r = rMin + (rMax - rMin) * k;

      const halo = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 2.4);
      halo.addColorStop(0, 'rgba(140, 220, 210, 0.25)');
      halo.addColorStop(1, 'rgba(140, 220, 210, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, rMax, 0, Math.PI * 2); ctx.stroke();

      const ball = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      ball.addColorStop(0, 'rgba(190, 245, 235, 0.95)');
      ball.addColorStop(1, 'rgba(110, 200, 190, 0.55)');
      ctx.fillStyle = ball;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.font = `300 ${Math.max(18, Math.min(W, H) * 0.035)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillText(label, cx, cy + rMax + 56);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.40)';
      ctx.font = `300 14px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillText(`${Math.ceil(remain)}`, cx, cy + rMax + 84);
    },
    /* 呼吸：气流声随圆球同步起伏 */
    sound(A, out) {
      const c = A.ctx;
      const src = A.noise();
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 500;
      f.Q.value = 0.4;
      const g = c.createGain();
      g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(out);
      return {
        update(t) {
          const { k } = breathState(t);
          g.gain.setTargetAtTime(0.03 + 0.20 * k, c.currentTime, 0.15);
        },
        dispose() { stopAll([src]); },
      };
    },
  };

  /* ================= 场景五：落雪 ================= */
  const snow = {
    name: '落雪',
    flakes: [],
    init() {
      this.inited = true;
      const n = Math.round(Math.min(160, W * H / 9000));
      this.flakes = Array.from({ length: n }, () => this.make(true));
    },
    make(anyY) {
      const depth = rand(0.3, 1);
      return {
        x: rand(0, W),
        y: anyY ? rand(0, H) : -10,
        r: 1 + depth * 2.2,
        vy: 12 + depth * 26,
        sway: rand(0.3, 0.8),
        phase: rand(0, Math.PI * 2),
        alpha: 0.25 + depth * 0.6,
      };
    },
    draw(dt, t) {
      bgGradient([[0, '#1d2433'], [0.7, '#27304a'], [1, '#323c5c']]);

      for (let i = 0; i < this.flakes.length; i++) {
        const f = this.flakes[i];
        f.y += f.vy * dt;
        f.x += Math.sin(t * f.sway + f.phase) * 10 * dt;
        if (f.y > H + 10) this.flakes[i] = this.make(false);
        ctx.fillStyle = `rgba(240, 245, 255, ${f.alpha})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    /* 落雪：清冷绵长的风声 */
    sound(A, out) {
      const nodes = A.wind(out, { vol: 0.20, cutoff: 200 });
      return { dispose() { stopAll(nodes); } };
    },
  };

  /* ================= 场景六：落雨 ================= */
  const rain = {
    name: '落雨',
    drops: [],
    ripples: [],
    init() {
      this.inited = true;
      const n = Math.round(Math.min(150, W * H / 8500));
      this.drops = Array.from({ length: n }, () => this.make(true));
      this.ripples = [];
    },
    make(anyY) {
      const depth = rand(0.3, 1);
      return {
        x: rand(-30, W + 30),
        y: anyY ? rand(-H, H) : rand(-60, -10),
        len: 9 + depth * 14,
        vy: 230 + depth * 220,
        depth,
        alpha: 0.10 + depth * 0.22,
      };
    },
    draw(dt, t) {
      bgGradient([[0, '#1f2535'], [0.65, '#262d42'], [1, '#1a1f2e']]);
      // 雨雾
      const fog = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.7);
      fog.addColorStop(0, 'rgba(120, 135, 170, 0.10)');
      fog.addColorStop(1, 'rgba(120, 135, 170, 0)');
      ctx.fillStyle = fog;
      ctx.fillRect(0, 0, W, H);

      const slant = 0.12; // 雨丝微微倾斜
      ctx.lineWidth = 1;
      for (let i = 0; i < this.drops.length; i++) {
        const d = this.drops[i];
        d.y += d.vy * dt;
        d.x += d.vy * slant * dt;
        if (d.y > H + 10) {
          // 一部分雨滴落地时激起涟漪
          if (d.depth > 0.6 && this.ripples.length < 14 && Math.random() < 0.35) {
            this.ripples.push({ x: d.x, y: H - rand(4, 36), life: 0 });
          }
          this.drops[i] = this.make(false);
          continue;
        }
        ctx.strokeStyle = `rgba(200, 212, 240, ${d.alpha})`;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.len * slant, d.y - d.len);
        ctx.stroke();
      }

      for (let i = this.ripples.length - 1; i >= 0; i--) {
        const r = this.ripples[i];
        r.life += dt;
        const p = r.life / 1.1;
        if (p >= 1) { this.ripples.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(200, 212, 240, ${0.30 * (1 - p)})`;
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, 4 + p * 22, (4 + p * 22) * 0.30, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    },
    /* 落雨：连绵的雨声 + 偶尔清脆的水滴 */
    sound(A, out) {
      const c = A.ctx;
      const src = A.noise();
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 1600;
      f.Q.value = 0.4;
      const g = c.createGain();
      g.gain.value = 0.16;
      src.connect(f); f.connect(g); g.connect(out);
      const lfo = c.createOscillator(); lfo.frequency.value = 0.09;
      const lg = c.createGain(); lg.gain.value = 0.03;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      let next = 0;
      return {
        update(t) {
          if (t < next) return;
          next = t + rand(0.15, 0.5);
          A.droplet(out);
        },
        dispose() { stopAll([src, lfo]); },
      };
    },
  };

  /* ================= 场景七：昼夜 ================= */
  /* 天空颜色关键帧，d 为一天中的时刻（0 = 午夜，0.5 = 正午） */
  const SKY = [
    { d: 0.00, top: [5, 8, 25],     bot: [15, 20, 45] },
    { d: 0.22, top: [15, 18, 50],   bot: [70, 45, 85] },
    { d: 0.27, top: [60, 70, 130],  bot: [240, 140, 90] },
    { d: 0.35, top: [100, 150, 210], bot: [185, 215, 235] },
    { d: 0.50, top: [110, 165, 220], bot: [195, 222, 240] },
    { d: 0.65, top: [100, 150, 210], bot: [200, 205, 225] },
    { d: 0.73, top: [70, 70, 140],  bot: [245, 150, 100] },
    { d: 0.78, top: [25, 25, 70],   bot: [90, 60, 100] },
    { d: 0.85, top: [8, 12, 35],    bot: [25, 30, 60] },
    { d: 1.00, top: [5, 8, 25],     bot: [15, 20, 45] },
  ];
  function skyAt(d) {
    for (let i = 1; i < SKY.length; i++) {
      if (d <= SKY[i].d) {
        const a = SKY[i - 1], b = SKY[i];
        const k = (d - a.d) / (b.d - a.d);
        return { top: lerpC(a.top, b.top, k), bot: lerpC(a.bot, b.bot, k) };
      }
    }
    return SKY[SKY.length - 1];
  }
  /* 夜晚程度：白天 0，夜里 1，晨昏之间过渡 */
  function nightAmt(d) {
    if (d >= 0.30 && d <= 0.70) return 0;
    if (d > 0.22 && d < 0.30) return 1 - (d - 0.22) / 0.08;
    if (d > 0.70 && d < 0.78) return (d - 0.70) / 0.08;
    return 1;
  }

  const daynight = {
    name: '昼夜',
    T: 180, // 一个完整昼夜约 3 分钟
    d0: 0,
    stars: [],
    lastD: 0.5,
    init() {
      this.inited = true;
      // 起点对准当地真实时刻，再加速循环
      const now = new Date();
      this.d0 = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400;
      const n = Math.round(Math.min(130, W * H / 11000));
      this.stars = Array.from({ length: n }, () => ({
        x: rand(0, W), y: rand(0, H * 0.7),
        r: rand(0.4, 1.4),
        phase: rand(0, Math.PI * 2),
        blink: rand(0.3, 1.0),
      }));
    },
    orbXY(q) {
      // 在天空中划过的弧线，q ∈ [0,1]
      return {
        x: W * (0.10 + 0.80 * q),
        y: H * 0.80 - Math.sin(q * Math.PI) * H * 0.56,
      };
    },
    draw(dt, t) {
      const d = (this.d0 + t / this.T) % 1;
      this.lastD = d;
      const sky = skyAt(d);
      bgGradient([[0, rgb(sky.top)], [1, rgb(sky.bot)]]);
      const na = nightAmt(d);

      // 星星只在夜里出现
      if (na > 0.02) {
        for (const s of this.stars) {
          const tw = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.blink + s.phase))) * na;
          ctx.fillStyle = `rgba(235, 240, 255, ${tw})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 太阳（6:00 - 18:00）
      if (d > 0.25 && d < 0.75) {
        const q = (d - 0.25) / 0.5;
        const { x, y } = this.orbXY(q);
        const low = 1 - Math.sin(q * Math.PI); // 越接近地平线越暖
        const r = Math.min(W, H) * 0.045;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
        glow.addColorStop(0, `rgba(255, ${Math.round(225 - low * 70)}, ${Math.round(170 - low * 80)}, 0.55)`);
        glow.addColorStop(1, 'rgba(255, 200, 130, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(x, y, r * 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgb(255, ${Math.round(238 - low * 60)}, ${Math.round(200 - low * 90)})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      } else {
        // 月亮（18:00 - 次日 6:00）
        const q = d >= 0.75 ? (d - 0.75) / 0.5 : (d + 0.25) / 0.5;
        const { x, y } = this.orbXY(q);
        const r = Math.min(W, H) * 0.035;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
        glow.addColorStop(0, 'rgba(220, 230, 255, 0.30)');
        glow.addColorStop(1, 'rgba(220, 230, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgb(235, 240, 250)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        // 月面阴影，呈现弯月
        ctx.fillStyle = rgb(lerpC(sky.top, [40, 45, 70], 0.5));
        ctx.beginPath(); ctx.arc(x - r * 0.38, y - r * 0.18, r * 0.92, 0, Math.PI * 2); ctx.fill();
      }

      // 远近两层山丘剪影，颜色随昼夜变化
      const hillNear = lerpC([52, 84, 72], [10, 14, 26], na);
      const hillFar = lerpC([72, 108, 96], [16, 22, 38], na);
      this.hill(0.74, 36, 16, 0.9, hillFar, t);
      this.hill(0.83, 44, 20, 1.7, hillNear, t);
    },
    hill(base, a1, a2, seed, color, t) {
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) {
        const y = H * base
          + Math.sin((x / W) * Math.PI * 2 * 1.1 + seed * 5) * a1
          + Math.sin((x / W) * Math.PI * 2 * 2.7 + seed * 11) * a2;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = rgb(color);
      ctx.fill();
    },
    /* 昼夜：旷野的风，入夜后传来蟋蟀声 */
    sound(A, out) {
      const nodes = A.wind(out, { vol: 0.14, cutoff: 240 });
      const self = this;
      let next = 0;
      return {
        update(t) {
          if (nightAmt(self.lastD) < 0.5 || t < next) return;
          next = t + rand(0.9, 2.6);
          A.cricket(out);
        },
        dispose() { stopAll(nodes); },
      };
    },
  };

  /* ================= 场景管理与切换 ================= */
  const scenes = [fireflies, waves, stars, breath, snow, rain, daynight];

  /* 按当地时间挑选初始场景 */
  function sceneByHour(h) {
    const idx = name => scenes.findIndex(s => s.name === name);
    if (h >= 5 && h < 9) return idx('昼夜');   // 清晨：看日出
    if (h >= 9 && h < 16) return idx('海浪');  // 白天：海边
    if (h >= 16 && h < 19) return idx('昼夜'); // 傍晚：看日落
    if (h >= 19 && h < 22) return idx('萤火'); // 入夜：萤火虫
    return idx('星夜');                        // 深夜：星空
  }
  let current = sceneByHour(new Date().getHours());
  let switching = false;

  scenes.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.textContent = s.name;
    btn.addEventListener('click', () => switchTo(i));
    switcher.appendChild(btn);
  });
  const buttons = [...switcher.children];

  function setActive() {
    buttons.forEach((b, i) => b.classList.toggle('active', i === current));
  }

  function switchTo(i) {
    if (i === current || switching) return;
    switching = true;
    fadeEl.classList.add('on');
    setTimeout(() => {
      current = i;
      scenes[current].init();
      setActive();
      audio.play();
      fadeEl.classList.remove('on');
      switching = false;
    }, 700);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') switchTo((current + 1) % scenes.length);
    if (e.key === 'ArrowLeft') switchTo((current - 1 + scenes.length) % scenes.length);
  });

  /* ================= 界面自动隐藏 ================= */
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
  }
  ['mousemove', 'touchstart', 'keydown', 'click'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true })
  );

  /* ================= 主循环 ================= */
  let last = performance.now();
  function loop(now) {
    // 标签页切回时 dt 可能很大，截断以避免动画跳跃
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    scenes[current].draw(dt, t);
    audio.update(t, dt);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  scenes[current].init();
  setActive();
  wake();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
