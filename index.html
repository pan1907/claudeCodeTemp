            y0: y + rand(-14, 14) - i * 10,
            vx: dir * rand(26, 38),
            phase: rand(0, Math.PI * 2),
          });
        }
      }
    },
    /* 昼夜：旷野的风；有鸟群飞过时才有鸟鸣（远处几只 + 近处偶尔一声，成群感） */
    sound(A, out) {
      const nodes = A.wind(out, { vol: 0.07, cutoff: 240 });
      const self = this;
      let near = 0, far = 0;
      return {
        update(t) {
          const active = nightAmt(self.lastD) <= 0.45 && self.birds.length > 0;
          if (!active) return;
          if (t >= far) { far = t + rand(1.2, 3); A.bird(out, rand(0.55, 1)); }
          if (t >= near) { near = t + rand(3, 5); A.bird(out, rand(0, 0.35)); }
        },
        dispose() { stopAll(nodes); },
      };
    },
  };

  /* ================= 场景八：种地 ================= */
  /* 四季各自的天空与土地配色（在相邻季节之间平滑过渡） */
  const SEASONS = [
    { name: '春', sky: [[150, 200, 222], [212, 228, 220]], soil: [[96, 66, 44], [72, 50, 32]] },
    { name: '夏', sky: [[118, 178, 224], [196, 226, 234]], soil: [[100, 68, 44], [74, 50, 32]] },
    { name: '秋', sky: [[224, 198, 150], [240, 220, 176]], soil: [[112, 80, 50], [86, 60, 38]] },
    { name: '冬', sky: [[176, 192, 214], [224, 232, 240]], soil: [[206, 210, 220], [228, 232, 238]] },
  ];
  /* 由一年中的进度 yp(0..1) 求出当前的生长 / 金黄 / 积雪等状态 */
  function farmState(yp) {
    const si = Math.floor(yp * 4) % 4;
    const sp = yp * 4 - Math.floor(yp * 4);
    let g = 0, gold = 0, snow = 0, flowers = 0;
    if (si === 0) {            // 春：积雪消融，禾苗钻出、抽长，野花渐开
      g = 0.12 + sp * 0.5;
      snow = Math.max(0, 1 - sp / 0.35);
      flowers = Math.min(1, sp * 2);
    } else if (si === 1) {     // 夏：绿意最盛，夏末开始泛黄
      g = 0.62 + sp * 0.38;
      flowers = Math.max(0, 0.5 - sp);
      gold = Math.max(0, (sp - 0.85) / 0.15) * 0.4;
    } else if (si === 2) {     // 秋：入秋很快金黄，金浪一片后才开镰
      g = 1;
      gold = Math.min(1, 0.4 + sp / 0.08);
    } else {                   // 冬：田地休眠、白雪覆盖
      g = 0;
      snow = Math.min(1, sp / 0.4);
    }
    return { si, sp, g, gold, snow, flowers };
  }
  /* 季节内的昼夜：每个季节经历一次黄昏与黎明（0 白天 → 1 深夜） */
  function seasonNight(sp) {
    if (sp < 0.60) return 0;
    if (sp < 0.70) return (sp - 0.60) / 0.10;
    if (sp < 0.92) return 1;
    return 1 - (sp - 0.92) / 0.08;
  }

  const farming = {
    name: '种地',
    YEAR: 360,        // 一年约 6 分钟：每季一分半，足够农人慢慢走完一趟
    t0: 0,
    crops: [],
    parts: [],        // 飘浮的花瓣 / 谷粒 / 水滴 / 雪沫
    flutters: [],     // 蝴蝶
    sheaves: [],      // 秋收立起的谷垛
    smoke: [],        // 小屋的炊烟
    skyStars: [],
    lastNk: 0,
    lastSheaf: -1,
    farmDir: 1,
    init() {
      this.inited = true;
      this.t0 = performance.now() / 1000;
      const count = Math.round(Math.min(150, W / 9));
      this.crops = [];
      for (let i = 0; i < count; i++) {
        const x = (i + 0.5) / count * W + rand(-5, 5);
        if (x > W * 0.78 && x < W * 0.97) continue; // 给小屋留出位置
        this.crops.push(this.seed(x, 1));
      }
      this.parts = [];
      this.flutters = [];
      this.sheaves = [];
      this.smoke = [];
      this.lastSheaf = -1;
      this.skyStars = Array.from({ length: 40 }, () => ({
        x: rand(0, W), y: rand(0, H * 0.5),
        r: rand(0.4, 1.3), phase: rand(0, 7), blink: rand(0.3, 1),
      }));
      this.treeShake = 0;   // 摇树的余晃
      this.treeSnow = 1;    // 树上积雪量（摇掉后慢慢再积起来）
      this.snowPh = rand(0, 7);
      this.moonPh = moonPhase(new Date());  // 当天真实月相（与昼夜场景一致）
      this.cat = { x: W * 0.5, dir: 1, state: 'sit', timer: 3, target: W * 0.5, jump: 0, bonk: 0 };
      this.fallApples = [];   // 从树上掉落的苹果
      this.daw = null;        // 寒鸦：冬日飞过 / 秋日飞来吃苹果
      this.winterRolled = false;
      this.autumnRolled = false;
      this.dawSpawnT = Infinity;
      this.eatenApples = {};  // 被吃掉的苹果：index → 啄食进度 0→1（当年秋天内保持）
      this.birdPair = null;   // 秋日飞来吃苹果的一黑一粉两只胖鸟
      this.pairSpawnT = Infinity;
      this.kid = null;        // 夏日跑出来踢球的小朋友
      this.kidRolled = false;
      this.kidSpawnT = Infinity;
      this.catLure = 0;       // 秋天落果前后，猫偏向溜达到树下的概率
      // 屋边的苹果树：错落的枝桠骨架 + 固定的树冠簇、果位与花位，随四季换装
      const tR = Math.min(W, H) * 0.082;
      this.tree0 = {
        x: W * 0.795, R: tR,
        // 错落不对称的枝桠：左密右疏、高低长短各异
        branches: [
          { h: 0.50, side: -1.05, len: 1.08, lift: 0.40, twig: true },
          { h: 0.45, side: 0.65,  len: 0.74, lift: 0.70, twig: true },
          { h: 0.36, side: 1.10,  len: 1.02, lift: 0.52, twig: true },
          { h: 0.31, side: -0.80, len: 0.60, lift: 0.96, twig: false },
          { h: 0.22, side: -1.12, len: 0.92, lift: 0.74, twig: true },
          { h: 0.16, side: 0.92,  len: 0.78, lift: 1.00, twig: false },
          { h: 0.09, side: -0.45, len: 0.46, lift: 1.22, twig: true },
          { h: 0.04, side: 0.40,  len: 0.54, lift: 1.16, twig: false },
          { h: 0.00, side: -0.12, len: 0.16, lift: 1.46, twig: false }, // 顶梢
        ].map(b => ({ ...b, len: b.len * rand(0.9, 1.12), lift: b.lift * rand(0.92, 1.08) })),
        // 更大、更饱满的树冠
        clusters: Array.from({ length: 32 }, () => {
          const ang = rand(0, Math.PI * 2), rr = Math.sqrt(Math.random());
          return {
            dx: Math.cos(ang) * tR * 1.25 * rr,
            dy: -Math.sin(ang) * tR * 1.0 * rr - tR * 0.18,
            r: rand(tR * 0.34, tR * 0.52), ph: rand(0, 7),
          };
        }),
        apples: Array.from({ length: 14 }, () => ({ dx: rand(-tR * 1.05, tR * 1.05), dy: rand(-tR * 0.7, tR * 0.5) })),
        blossoms: Array.from({ length: 22 }, () => ({ dx: rand(-tR * 1.1, tR * 1.1), dy: rand(-tR * 0.95, tR * 0.35) })),
      };
    },
    seed(x, grow) {
      return {
        x, base: rand(0.8, 1.2), sway: rand(0, Math.PI * 2),
        lean: rand(-0.12, 0.12), grow, cut: false,
      };
    },
    /* 造一只蝴蝶：从调色板随机挑 2-3 种颜色调出主色；约半数是双色的花蝴蝶。全场最多 9 只 */
    spawnButterfly(x, y, vx) {
      if (this.flutters.length >= 9) return;
      const PAL = [
        [255, 196, 70], [255, 122, 92], [156, 122, 224], [96, 168, 232],
        [255, 152, 192], [244, 240, 232], [122, 200, 150], [240, 200, 60],
      ];
      const blend = (n) => {
        let ws = 0, mix = [0, 0, 0];
        for (let i = 0; i < n; i++) {
          const c = PAL[Math.floor(Math.random() * PAL.length)];
          const w = 0.3 + Math.random();
          ws += w;
          for (let k = 0; k < 3; k++) mix[k] += c[k] * w;
        }
        return mix.map(v => Math.round(v / ws));
      };
      this.flutters.push({
        x, y, vx, phase: rand(0, 7), life: 0, dur: rand(10, 20),
        c: blend(2 + (Math.random() < 0.5 ? 1 : 0)),
        c2: Math.random() < 0.55 ? blend(2) : null,
        size: rand(0.85, 1.3),
      });
    },
    /* 冬天摇树：枝桠一抖，落下一蓬雪 */
    shakeTree() {
      const tr = this.tree0, hY = this.horizon();
      this.treeShake = 1;
      const cy = hY - tr.R * 1.55 - tr.R * 0.30;
      for (let i = 0; i < 14 && this.parts.length < 110; i++) {
        this.parts.push({
          x: tr.x + rand(-tr.R * 1.1, tr.R * 1.1), y: cy + rand(-tr.R * 0.6, tr.R * 0.7),
          vx: rand(-10, 10), vy: rand(5, 25), g: 230,
          r: rand(1.6, 3.2), phase: rand(0, 7), life: 0, dur: rand(0.9, 1.5),
          alpha: 0.9, c: [240, 245, 252],
        });
      }
      this.treeSnow = 0.3;
    },
    horizon() { return H * 0.83; },  // 地平线靠下，田土只占薄薄一条
    cropH() { return H * 0.045; },   // 稻子比较矮，明显低于农人
    /* 画一丛稻：三秆错落呈扇形，成熟时每秆垂下一束稻穗 */
    stalk(c, gold, t, nk) {
      const hY = this.horizon();
      const sh = 1 - 0.5 * nk;
      if (c.cut) {
        ctx.strokeStyle = `rgba(${172 * sh | 0},${134 * sh | 0},${70 * sh | 0},0.9)`;
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (const ox of [-2.5, 0, 2.5]) {
          ctx.moveTo(c.x + ox, hY);
          ctx.lineTo(c.x + ox + c.lean * 5, hY - 6);
        }
        ctx.stroke();
        return;
      }
      const hBase = this.cropH() * c.grow * c.base;
      if (hBase < 2) return;
      // 秋天向饱满的金黄过渡
      const cr = lerp(110, 218, gold) * sh, cg = lerp(170, 166, gold) * sh, cb = lerp(70, 58, gold) * sh;
      const stem = `rgb(${cr | 0},${cg | 0},${cb | 0})`;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * 2.6;
        const lean2 = c.lean + (i - 1) * 0.14;
        const h = hBase * (i === 1 ? 1 : 0.85);
        const topX = c.x + ox + Math.sin(t * 0.5 + c.sway + i) * 4 * c.grow + lean2 * h;
        const topY = hY - h;
        ctx.strokeStyle = stem;
        ctx.lineWidth = 1.1 + c.grow * 0.8;
        ctx.beginPath();
        ctx.moveTo(c.x + ox, hY);
        ctx.quadraticCurveTo((c.x + ox + topX) / 2 - lean2 * 5, hY - h * 0.5, topX, topY);
        ctx.stroke();
        // 成熟后沉甸甸、饱满下垂的稻穗
        if (gold > 0.05 && c.grow > 0.7) {
          const gc = `rgba(${236 * sh | 0},${200 * sh | 0},${96 * sh | 0},${gold})`;
          // 下垂的穗轴（越饱满垂得越沉）
          const ex = topX + 6 + (i - 1) * 1.2, ey = topY + 11;
          ctx.strokeStyle = gc;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(topX, topY);
          ctx.quadraticCurveTo(topX + 5 + (i - 1), topY + 2, ex, ey);
          ctx.stroke();
          // 沿穗轴长出一排饱满的谷粒，让穗子丰满
          ctx.fillStyle = gc;
          for (let k = 1; k <= 5; k++) {
            const tt = k / 6;
            const bx = topX + (ex - topX) * tt, by = topY + (ey - topY) * tt;
            const side = (k % 2) ? 1 : -1;
            ctx.beginPath();
            ctx.ellipse(bx + side * 2.2, by + 0.5, 2.0, 1.2, side * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    },
    /* 戴斗笠的农人：小巧、圆润、流线的剪影 */
    farmer(x, t, nk, action) {
      const a = Math.max(0, 1 - nk * 1.8) * 0.9;
      if (a <= 0.02) return;
      const hY = this.horizon();
      const u = H * 0.072 / 64;   // 比稻子高、又不抢主角的小个子
      ctx.save();
      ctx.translate(x, hY + 1);
      ctx.scale(u * this.farmDir, u);
      const col = `rgba(44, 36, 28, ${a})`;
      ctx.fillStyle = col;
      ctx.strokeStyle = col;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const stride = (action === 'stand' || action === 'build') ? 2.2 : Math.sin(t * 2.0) * 5;  // 缓慢的步态
      // 腿：圆润的锥形
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(0, -24); ctx.quadraticCurveTo(stride * 0.5, -12, stride, 0);
      ctx.moveTo(0, -24); ctx.quadraticCurveTo(-stride * 0.5, -12, -stride, 0);
      ctx.stroke();
      // 身体：一颗微微前倾的圆润豆形，从胯到肩一笔成形
      const lean = action === 'cut' ? 5 : action === 'build' ? 6 : action === 'sow' ? 3.5 : 2.5;
      ctx.beginPath();
      ctx.moveTo(-5, -24);
      ctx.bezierCurveTo(-6.5, -36, lean - 4, -46, lean, -47);
      ctx.bezierCurveTo(lean + 4, -46, 6.5, -36, 5, -24);
      ctx.quadraticCurveTo(0, -20, -5, -24);
      ctx.closePath();
      ctx.fill();
      // 脖子与圆头
      ctx.beginPath(); ctx.arc(lean + 0.5, -52, 4.2, 0, Math.PI * 2); ctx.fill();
      // 斗笠：圆顶 + 柔和的弧形帽檐
      ctx.beginPath();
      ctx.moveTo(lean - 11, -54.5);
      ctx.quadraticCurveTo(lean + 0.5, -52, lean + 11, -54.5);
      ctx.quadraticCurveTo(lean + 0.5, -62.5, lean - 11, -54.5);
      ctx.closePath();
      ctx.fill();
      // 手臂与农具
      ctx.lineWidth = 3.6;
      if (action === 'sow') {
        const swing = Math.sin(t * 1.6);
        ctx.beginPath(); ctx.moveTo(lean - 1, -44); ctx.quadraticCurveTo(-7, -38, -10, -34); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(-11, -32, 5.5, 4.2, 0.2, 0, Math.PI * 2); ctx.fill(); // 种子篮
        ctx.beginPath(); ctx.moveTo(lean + 1, -44); ctx.quadraticCurveTo(9, -40 + swing * 3, 13 + swing * 4, -37 + swing * 4); ctx.stroke();
      } else if (action === 'water') {
        ctx.beginPath(); ctx.moveTo(lean + 1, -44); ctx.quadraticCurveTo(9, -40, 13, -36); ctx.stroke();
        ctx.save();
        ctx.translate(16, -34); ctx.rotate(0.5);
        ctx.beginPath(); ctx.ellipse(0, 0, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill(); // 水壶
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(5, -2); ctx.lineTo(12, -6); ctx.stroke();      // 壶嘴
        ctx.restore();
      } else if (action === 'cut') {
        const sweep = Math.sin(t * 1.8) * 5;
        ctx.beginPath(); ctx.moveTo(lean, -43); ctx.quadraticCurveTo(9, -40, 14 + sweep, -36); ctx.stroke();
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(14 + sweep, -37);
        ctx.quadraticCurveTo(26 + sweep, -36, 30 + sweep, -27);  // 镰刀弧刃
        ctx.stroke();
      } else if (action === 'build') {
        // 弯着腰、双手在身前忙活（堆雪人）
        const bob = Math.sin(t * 2.4) * 3;
        ctx.beginPath(); ctx.moveTo(lean, -42); ctx.quadraticCurveTo(8, -36 + bob, 12, -30 + bob); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(lean - 1, -40); ctx.quadraticCurveTo(7, -33 + bob, 11, -26 + bob); ctx.stroke();
      } else if (action === 'stand') {
        // 拢着手站着看
        ctx.beginPath(); ctx.moveTo(lean, -43); ctx.quadraticCurveTo(5, -38, 4, -34); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(lean - 1, -43); ctx.quadraticCurveTo(-5, -38, -4, -34); ctx.stroke();
      } else {
        // 背着手查看长势
        ctx.beginPath(); ctx.moveTo(lean - 1, -43); ctx.quadraticCurveTo(-6, -38, -8, -33); ctx.stroke();
      }
      ctx.restore();
    },
    /* 田边的小屋：日落后与冬日里，窗口透出暖光、烟囱升起炊烟 */
    hut(nk, si, dt, snowAmt) {
      const hY = this.horizon();
      const w = Math.min(W, H) * 0.13, h = w * 0.5;
      const x = W * 0.875;
      const dk = 1 - 0.45 * nk;
      // 烟囱
      ctx.fillStyle = `rgb(${56 * dk | 0},${42 * dk | 0},${32 * dk | 0})`;
      ctx.fillRect(x + w * 0.24, hY - h - w * 0.40, w * 0.09, w * 0.26);
      // 屋身与屋顶
      ctx.fillStyle = `rgb(${88 * dk | 0},${66 * dk | 0},${48 * dk | 0})`;
      ctx.fillRect(x - w / 2, hY - h, w, h);
      ctx.fillStyle = `rgb(${62 * dk | 0},${46 * dk | 0},${34 * dk | 0})`;
      ctx.beginPath();
      ctx.moveTo(x - w * 0.62, hY - h);
      ctx.lineTo(x + w * 0.62, hY - h);
      ctx.lineTo(x, hY - h - w * 0.42);
      ctx.closePath();
      ctx.fill();
      // 门
      ctx.fillStyle = `rgb(${52 * dk | 0},${38 * dk | 0},${28 * dk | 0})`;
      ctx.fillRect(x + w * 0.10, hY - h * 0.62, w * 0.20, h * 0.62);
      // 窗：一年劳作，有处可归
      const lit = Math.max(nk, si === 3 ? 0.55 : 0);
      ctx.fillStyle = `rgba(255, 206, 120, ${0.10 + 0.78 * lit})`;
      ctx.fillRect(x - w * 0.32, hY - h * 0.60, w * 0.22, h * 0.28);
      // 屋顶、烟囱与窗台的积雪
      if (snowAmt > 0.02) {
        const sa = `rgba(238, 242, 250, ${0.92 * snowAmt})`;
        ctx.strokeStyle = sa;
        ctx.lineCap = 'round';
        ctx.lineWidth = w * 0.06;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.56, hY - h - w * 0.02);
        ctx.lineTo(x - w * 0.02, hY - h - w * 0.40);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w * 0.02, hY - h - w * 0.40);
        ctx.lineTo(x + w * 0.56, hY - h - w * 0.02);
        ctx.stroke();
        ctx.fillStyle = sa;
        ctx.fillRect(x + w * 0.225, hY - h - w * 0.435, w * 0.12, w * 0.045);
        ctx.fillRect(x - w * 0.34, hY - h * 0.60 - w * 0.018, w * 0.26, w * 0.022);
      }
      // 炊烟
      if ((si === 3 || nk > 0.3) && Math.random() < dt * 2.2 && this.smoke.length < 14) {
        this.smoke.push({ x: x + w * 0.285, y: hY - h - w * 0.40, life: 0, phase: rand(0, 7), dur: rand(3.5, 5) });
      }
      for (let i = this.smoke.length - 1; i >= 0; i--) {
        const s = this.smoke[i];
        s.life += dt;
        const q = s.life / s.dur;
        if (q >= 1) { this.smoke.splice(i, 1); continue; }
        s.y -= 14 * dt;
        s.x += Math.sin(s.life * 1.4 + s.phase) * 6 * dt + 4 * dt;
        ctx.fillStyle = `rgba(205, 210, 220, ${(1 - q) * 0.16})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2.5 + q * 7, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    /* 屋边的苹果树。一年的顺序遵循真实规律：
       春花未叶先 → 夏满冠浓绿、果子悄悄长大 → 初秋绿叶间红果成熟、收果 →
       收完果叶子才转黄、飘落 → 冬日光枝挂雪 */
    tree(si, sp, t, nk, dt) {
      const cl = v => Math.max(0, Math.min(1, v));
      const tr = this.tree0, R = tr.R, x = tr.x, hY = this.horizon();
      const trunkH = R * 1.55;
      const topY = hY - trunkH;
      const cy = topY - R * 0.30;       // 树冠中心
      const dk = 1 - 0.55 * nk;
      let leaf = 0, gold = 0, blossom = 0, apple = 0, ripen = 0, snow = 0;
      if (si === 0) {                   // 春：先开花，后抽叶
        blossom = cl((sp - 0.10) / 0.18) * cl((0.62 - sp) / 0.25);
        leaf = cl((sp - 0.42) / 0.5);
      } else if (si === 1) {            // 夏：枝繁叶茂，季末果子悄悄长大（青色）
        leaf = 1;
        apple = cl((sp - 0.70) / 0.30) * 0.9;
        ripen = cl((sp - 0.70) / 0.30) * 0.4;
      } else if (si === 2) {            // 秋：绿叶间果子转红、被收走，然后叶子才转黄、飘落
        apple = sp < 0.38 ? 1 : cl((0.46 - sp) / 0.08);
        ripen = Math.min(1, 0.4 + sp / 0.38 * 0.6);
        gold = cl((sp - 0.45) / 0.30);
        leaf = 1 - cl((sp - 0.65) / 0.30);
        // 收果时偶有苹果落下（独立追踪，可能砸到树下的猫）
        if (sp > 0.36 && sp < 0.46 && Math.random() < dt * 2.2 && this.fallApples.length < 8) {
          this.fallApples.push({
            x: x + rand(-R * 0.7, R * 0.7), y: cy + rand(-R * 0.3, R * 0.4),
            vx: rand(-12, 12), vy: 10, r: R * 0.085, hit: false,
          });
        }
      } else {                          // 冬：光枝挂雪
        snow = cl(sp / 0.4);
      }

      // 被点到时的余晃
      const shx = Math.sin(t * 26) * 3.5 * this.treeShake;
      // 树干：根部外扩、向上渐细，微带一点弯
      const wood = `rgb(${80 * dk | 0},${58 * dk | 0},${40 * dk | 0})`;
      ctx.fillStyle = wood;
      ctx.beginPath();
      ctx.moveTo(x - R * 0.20, hY);
      ctx.quadraticCurveTo(x - R * 0.13, hY - trunkH * 0.10, x - R * 0.105, hY - trunkH * 0.38);
      ctx.quadraticCurveTo(x - R * 0.085, hY - trunkH * 0.72, x - R * 0.048 + shx * 0.4, topY + R * 0.04);
      ctx.lineTo(x + R * 0.048 + shx * 0.4, topY + R * 0.04);
      ctx.quadraticCurveTo(x + R * 0.075, hY - trunkH * 0.68, x + R * 0.10, hY - trunkH * 0.34);
      ctx.quadraticCurveTo(x + R * 0.135, hY - trunkH * 0.08, x + R * 0.21, hY);
      ctx.closePath();
      ctx.fill();
      // 错落的枝桠：低处的粗、高处的细，带小杈
      ctx.strokeStyle = wood;
      ctx.lineCap = 'round';
      const tips = [];
      for (const b of tr.branches) {
        const ay = topY + R * b.h;
        const ex = x + b.side * R * b.len + shx;
        const ey = ay - R * b.lift * 0.55;
        const cxm = x + b.side * R * b.len * 0.35 + shx * 0.5, cym = ay - R * b.lift * 0.12;
        ctx.lineWidth = R * (0.045 + 0.045 * Math.min(1, b.len));
        ctx.beginPath();
        ctx.moveTo(x, ay);
        ctx.quadraticCurveTo(cxm, cym, ex, ey);
        ctx.stroke();
        // 枝梢更细的一截
        const tx = ex + b.side * R * 0.22, ty = ey - R * 0.16;
        ctx.lineWidth = R * 0.03;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(tx, ty);
        ctx.stroke();
        tips.push([ex, ey], [tx, ty]);
        // 小杈
        if (b.twig) {
          const mx = (x + ex) / 2 + b.side * R * 0.06, my = (ay + ey) / 2 - R * 0.04;
          const wx = mx + b.side * R * 0.16, wy = my - R * 0.24;
          ctx.lineWidth = R * 0.026;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(wx, wy);
          ctx.stroke();
          tips.push([wx, wy]);
        }
      }

      // 树冠：半透明的圆簇叠成柔和的轮廓
      if (leaf > 0.02) {
        const lc = lerpC([92, 152, 76], [212, 168, 66], gold);
        for (const c of tr.clusters) {
          const sw = Math.sin(t * 0.5 + c.ph) * 2;
          ctx.fillStyle = `rgba(${lc[0] * dk | 0},${lc[1] * dk | 0},${lc[2] * dk | 0},${0.5 * leaf})`;
          ctx.beginPath();
          ctx.arc(x + c.dx + sw + shx * 0.9, cy + c.dy, c.r * (0.55 + 0.45 * leaf), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // 春花
      if (blossom > 0.02) {
        for (const b of tr.blossoms) {
          ctx.fillStyle = `rgba(255, 228, 238, ${blossom * 0.95 * dk})`;
          ctx.beginPath();
          ctx.arc(x + b.dx + Math.sin(t * 0.5 + b.dx) * 1.5 + shx * 0.9, cy + b.dy, R * 0.055, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // 苹果：夏末青绿，入秋转红
      if (apple > 0.02) {
        const ac = lerpC([128, 158, 72], [198, 48, 42], ripen);
        const aR = R * 0.085 * (si === 1 ? 0.5 + 0.5 * cl((sp - 0.70) / 0.30) : 1);
        for (let ai = 0; ai < tr.apples.length; ai++) {
          const ap = tr.apples[ai];
          // 被寒鸦啄食的那颗会一口口缩小消失
          const ep = this.eatenApples[ai];
          const r = ep != null ? aR * Math.max(0, 1 - ep) : aR;
          if (r < 0.4) continue;
          ctx.fillStyle = `rgba(${ac[0] * dk | 0},${ac[1] * dk | 0},${ac[2] * dk | 0},${apple})`;
          ctx.beginPath();
          ctx.arc(x + ap.dx + shx * 0.9, cy + ap.dy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // 深秋落叶
      if (si === 2 && sp > 0.65 && Math.random() < dt * 6 && this.parts.length < 90) {
        this.parts.push({
          x: x + rand(-R, R), y: cy + rand(-R * 0.5, R * 0.5),
          vx: rand(-12, 12), vy: rand(8, 18), g: 6,
          r: rand(1.8, 2.8), phase: rand(0, 7), life: 0, dur: rand(2.5, 4),
          alpha: 0.85, c: [210, 150, 60],
        });
      }
      // 冬日积雪：厚厚一层压在每根枝桠上，枝头结出雪团（摇树会抖掉，再慢慢积起来）
      const snowOn = snow * this.treeSnow;
      if (snowOn > 0.02) {
        const sc = `rgba(240, 244, 252, ${Math.min(1, snowOn * 1.1)})`;
        ctx.strokeStyle = sc;
        ctx.lineCap = 'round';
        // 树干上的雪
        ctx.lineWidth = R * 0.09;
        ctx.beginPath();
        ctx.moveTo(x - R * 0.07, hY - trunkH * 0.3);
        ctx.quadraticCurveTo(x - R * 0.09, hY - trunkH * 0.6, x - R * 0.04 + shx * 0.4, topY + R * 0.12);
        ctx.stroke();
        for (const b of tr.branches) {
          const ay = topY + R * b.h;
          const ex = x + b.side * R * b.len + shx;
          const ey = ay - R * b.lift * 0.55;
          const cxm = x + b.side * R * b.len * 0.35 + shx * 0.5, cym = ay - R * b.lift * 0.12;
          ctx.lineWidth = R * (0.055 + 0.035 * Math.min(1, b.len));
          ctx.beginPath();
          ctx.moveTo(x, ay - R * 0.06);
          ctx.quadraticCurveTo(cxm, cym - R * 0.06, ex, ey - R * 0.05);
          ctx.stroke();
        }
        ctx.fillStyle = sc;
        for (const [px, py] of tips) {
          ctx.beginPath();
          ctx.ellipse(px, py - R * 0.04, R * 0.13, R * 0.075, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    },
    /* 雪人：冬日上午由农人堆起，立到来年春雪消融 */
    snowman(si, sp, snow, nk, t) {
      const cl = v => Math.max(0, Math.min(1, v));
      let b = 0, m = 0, h = 0, face = 0, melt = 1;
      if (si === 3) {
        b = cl((sp - 0.26) / 0.08);
        m = cl((sp - 0.35) / 0.07);
        h = cl((sp - 0.42) / 0.04);
        face = sp > 0.465 ? 1 : 0;
      } else if (si === 0 && snow > 0.05) {
        b = m = h = face = 1;
        melt = snow;
      } else return;
      if (b <= 0.01) return;
      const hY = this.horizon();
      const x = W * 0.50;
      const u = Math.min(W, H) * 0.001 * (0.4 + 0.6 * melt);
      const a = (1 - 0.35 * nk) * Math.min(1, melt * 1.6);
      const rb = 26 * u * b, rm = 19 * u * m, rh = 13 * u * h;
      const yb = hY - rb;
      const ym = yb - rb * 0.8 - rm * 0.7;
      const yh = ym - rm * 0.85 - rh * 0.65;
      ctx.fillStyle = `rgba(246, 249, 254, ${0.95 * a})`;
      for (const [yy, rr] of [[yb, rb], [ym, rm], [yh, rh]]) {
        if (rr < 0.5) continue;
        ctx.beginPath(); ctx.arc(x, yy, rr, 0, Math.PI * 2); ctx.fill();
      }
      if (face && rh > 2) {
        // 面朝田野：煤眼、胡萝卜鼻、树枝手、两颗纽扣
        ctx.fillStyle = `rgba(42, 44, 52, ${a})`;
        ctx.beginPath(); ctx.arc(x - rh * 0.52, yh - rh * 0.22, 1.6 * u, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x - rh * 0.10, yh - rh * 0.26, 1.6 * u, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, ym - rm * 0.25, 1.7 * u, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, ym + rm * 0.18, 1.7 * u, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(226, 130, 54, ${a})`;
        ctx.beginPath();
        ctx.moveTo(x - rh * 0.42, yh + rh * 0.10);
        ctx.lineTo(x - rh * 0.42 - 9 * u, yh + rh * 0.22);
        ctx.lineTo(x - rh * 0.36, yh + rh * 0.34);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = `rgba(96, 70, 46, ${a})`;
        ctx.lineWidth = 1.6 * u;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - rm * 0.85, ym - rm * 0.10);
        ctx.lineTo(x - rm * 1.75, ym - rm * 0.95);
        ctx.moveTo(x + rm * 0.85, ym - rm * 0.05);
        ctx.lineTo(x + rm * 1.55, ym - rm * 0.75);
        ctx.stroke();
      }
    },
    /* 布偶猫的一天：白天在田里溜达、扑蝴蝶；入夜回家——冬天进屋睡，别的季节睡屋檐下 */
    catStep(dt, t, nk) {
      const c = this.cat;
      const spd = Math.min(W, H) * 0.045;
      // 被苹果砸到：愣住、缩一下，片刻后回神
      if (c.state === 'bonk') {
        c.bonk -= dt;
        if (c.bonk <= 0) { c.state = 'sit'; c.timer = rand(1.5, 3); }
        return;
      }
      const winter = this.lastSi === 3;
      const eaveX = W * 0.875 - Math.min(W, H) * 0.137;     // 屋檐下
      const doorX = W * 0.875 + Math.min(W, H) * 0.13 * 0.20; // 屋门口
      const homeX = winter ? doorX : eaveX;
      const nightState = winter ? 'inside' : 'sleep';
      if (nk > 0.5) {
        if (c.state !== 'sleep' && c.state !== 'inside') {
          if (Math.abs(c.x - homeX) > 8) { c.state = 'walk'; c.target = homeX; }
          else c.state = nightState;
        }
      } else if ((c.state === 'sleep' || c.state === 'inside') && nk < 0.45) {
        c.state = 'sit';
        c.timer = rand(2, 6);
      }
      switch (c.state) {
        case 'sit':
          c.timer -= dt;
          if (c.timer <= 0) {
            const prey = this.flutters.find(b => Math.abs(b.x - c.x) < W * 0.30);
            if (prey && Math.random() < 0.6) { c.state = 'chase'; c.timer = 5; }
            else {
              c.state = 'walk';
              // 落果前后有概率把目标选在树下，正常脚步慢慢溜达过去
              if (this.catLure > 0 && Math.random() < this.catLure) {
                c.target = this.tree0.x + rand(-this.tree0.R * 0.5, this.tree0.R * 0.5);
                c.toTree = true;
              } else {
                c.target = rand(W * 0.06, W * 0.84);
                c.toTree = false;
              }
            }
          }
          break;
        case 'walk': {
          const dx = c.target - c.x;
          c.dir = dx > 0 ? 1 : -1;
          const ws = nk > 0.5 ? spd * 1.9 : spd;   // 入夜赶着回家，脚步快些
          c.x += c.dir * ws * dt;
          if (Math.abs(dx) < 6) { c.state = nk > 0.5 ? nightState : 'sit'; c.timer = rand(2.5, 7); }
          break;
        }
        case 'chase': {
          c.timer -= dt;
          let prey = null;
          for (const b of this.flutters) {
            if (!prey || Math.abs(b.x - c.x) < Math.abs(prey.x - c.x)) prey = b;
          }
          if (!prey || c.timer <= 0) { c.state = 'sit'; c.timer = rand(2, 5); break; }
          c.dir = prey.x > c.x ? 1 : -1;
          c.x += c.dir * spd * 2.1 * dt;
          if (Math.abs(prey.x - c.x) < W * 0.02) {
            c.state = 'pounce';
            c.jump = 0;
            sfx('mew');   // 扑蝴蝶时清脆地"喵!"一声
            prey.vx = c.dir * Math.max(24, Math.abs(prey.vx)) * 2.2; // 蝴蝶受惊飞走
            prey.dur = Math.min(prey.dur, prey.life + 2.5);
            prey.scared = true;
          }
          break;
        }
        case 'pounce':
          c.jump += dt;
          c.x += c.dir * spd * 1.6 * dt;
          if (c.jump > 0.5) { c.state = 'sit'; c.timer = rand(1.5, 4); }
          break;
      }
      c.x = Math.max(W * 0.03, Math.min(W * 0.97, c.x));
    },
    /* 布偶猫：奶白的身子，深灰的耳朵、面罩与尾巴 */
    drawCat(t, nk) {
      const c = this.cat;
      const hY = this.horizon();
      const u = Math.min(W, H) * 0.0006;
      const a = 0.92 - nk * 0.25;
      const cream = `rgba(238, 232, 222, ${a})`;
      const point = `rgba(118, 104, 96, ${a})`;
      const d = c.dir;
      const g = hY + 1;
      if (c.state === 'inside') return;   // 冬夜进了屋，不再画出来
      if (c.state === 'sleep') {
        const br = 1 + Math.sin(t * 1.3) * 0.05;          // 睡梦中的呼吸起伏
        ctx.fillStyle = cream;
        ctx.beginPath(); ctx.ellipse(c.x, g - 7 * u * br, 14 * u, 7.5 * u * br, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(c.x - 9 * u, g - 8.5 * u, 5.5 * u, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = point;
        ctx.beginPath();
        ctx.moveTo(c.x - 13 * u, g - 11.5 * u);
        ctx.lineTo(c.x - 11.5 * u, g - 16 * u);
        ctx.lineTo(c.x - 8 * u, g - 13 * u);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = point;
        ctx.lineWidth = 3 * u;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(c.x + 12 * u, g - 4 * u);
        ctx.quadraticCurveTo(c.x + 2 * u, g - 0.5 * u, c.x - 10 * u, g - 3 * u);
        ctx.stroke();
        return;
      }
      if (c.state === 'bonk') {
        // 被砸到：缩成一团、耳朵向后、头上转着小星星
        const sh = 1 + Math.sin(c.bonk * 40) * 0.04;          // 受惊的小颤
        ctx.fillStyle = cream;
        ctx.beginPath(); ctx.ellipse(c.x, g - 7 * u, 13 * u, 7 * u * sh, 0, 0, Math.PI * 2); ctx.fill();
        const hx = c.x + d * 9 * u, hy = g - 13 * u;          // 头缩低
        ctx.beginPath(); ctx.arc(hx, hy, 6 * u, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = point;                                 // 耳朵向后压
        for (const sgn of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(hx + sgn * 4 * u, hy - 3 * u);
          ctx.lineTo(hx - d * 3 * u + sgn * 2 * u, hy - 7 * u);
          ctx.lineTo(hx - d * 1 * u + sgn * 4.5 * u, hy - 2 * u);
          ctx.closePath(); ctx.fill();
        }
        // ><  紧闭的眼
        ctx.strokeStyle = point; ctx.lineWidth = 1.4 * u; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(hx + d * 2 * u, hy - 1.5 * u); ctx.lineTo(hx + d * 4.5 * u, hy);
        ctx.lineTo(hx + d * 2 * u, hy + 1.5 * u);
        ctx.stroke();
        // 头顶打转的小星星
        ctx.fillStyle = `rgba(255, 224, 120, ${a})`;
        for (let k = 0; k < 3; k++) {
          const ang = t * 6 + k * (Math.PI * 2 / 3);
          const sx = hx + Math.cos(ang) * 8 * u, sy = hy - 9 * u + Math.sin(ang) * 2.5 * u;
          const sr = 2.4 * u;
          ctx.beginPath();   // 四角星
          for (let p = 0; p < 8; p++) {
            const pa = p / 8 * Math.PI * 2, rr = (p % 2 ? 0.4 : 1) * sr;
            ctx.lineTo(sx + Math.cos(pa) * rr, sy + Math.sin(pa) * rr);
          }
          ctx.closePath(); ctx.fill();
        }
        return;
      }
      const sitting = c.state === 'sit';
      const hop = c.state === 'pounce' ? Math.sin(Math.min(1, c.jump / 0.5) * Math.PI) * 16 * u : 0;
      const stretch = c.state === 'pounce' ? 1.18 : 1;
      const bodyY = g - 11 * u - hop;
      ctx.fillStyle = cream;
      if (sitting) {
        ctx.beginPath(); ctx.ellipse(c.x, g - 10 * u, 8.5 * u, 11 * u, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.ellipse(c.x, bodyY, 14 * u * stretch, 7 * u / stretch, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = cream;
        ctx.lineWidth = 2.6 * u;
        ctx.lineCap = 'round';
        const off = [9, 5, -5, -9];
        for (let i = 0; i < 4; i++) {
          const px = c.x + d * off[i] * u;
          const sw = c.state === 'pounce' ? (i < 2 ? d * 7 : -d * 3) * u : Math.sin(t * 8 + i * 2.2) * 3.5 * u;
          ctx.beginPath();
          ctx.moveTo(px, bodyY + 4 * u);
          ctx.lineTo(px + sw, g - hop * 0.4);
          ctx.stroke();
        }
      }
      // 头、耳朵与面罩
      const hx = c.x + d * (sitting ? 0 : 14) * u;
      const hy = sitting ? g - 23 * u : bodyY - 6 * u;
      ctx.fillStyle = cream;
      ctx.beginPath(); ctx.arc(hx, hy, 6.2 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = point;
      for (const sgn of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(hx + sgn * 4.5 * u, hy - 3.5 * u);
        ctx.lineTo(hx + sgn * 5.5 * u, hy - 9 * u);
        ctx.lineTo(hx + sgn * 1 * u, hy - 5.5 * u);
        ctx.closePath(); ctx.fill();
      }
      ctx.beginPath(); ctx.ellipse(hx + d * 3.2 * u, hy + 1.2 * u, 3.2 * u, 2.6 * u, 0, 0, Math.PI * 2); ctx.fill();
      // 尾巴轻摆
      ctx.strokeStyle = point;
      ctx.lineWidth = 3 * u;
      ctx.lineCap = 'round';
      const tip = Math.sin(t * 2.2) * 3 * u;
      ctx.beginPath();
      if (sitting) {
        ctx.moveTo(c.x - d * 5 * u, g - 4 * u);
        ctx.quadraticCurveTo(c.x - d * 14 * u, g - 2 * u, c.x - d * 16 * u + tip, g - 9 * u);
      } else {
        ctx.moveTo(c.x - d * 12 * u, bodyY + 2 * u);
        ctx.quadraticCurveTo(c.x - d * 19 * u, bodyY - 7 * u, c.x - d * 17 * u + tip, bodyY - 14 * u);
      }
      ctx.stroke();
    },
    /* 掉落的苹果：受重力下落、落地或砸到猫；砸中猫则触发被砸反应 */
    stepApples(dt) {
      const hY = this.horizon();
      const u = Math.min(W, H) * 0.0006;
      const c = this.cat;
      const hittable = c.state === 'sit' || c.state === 'walk' || c.state === 'chase';
      const headX = c.x + (c.state === 'sit' ? 0 : c.dir * 14 * u);
      const headY = hY + 1 - (c.state === 'sit' ? 23 : 17) * u;
      for (let i = this.fallApples.length - 1; i >= 0; i--) {
        const ap = this.fallApples[i];
        ap.vy += 520 * dt;
        ap.x += ap.vx * dt; ap.y += ap.vy * dt;
        const crumb = ap.poop ? [120, 84, 50] : [198, 50, 44];
        // 砸到猫头
        if (!ap.hit && hittable && Math.abs(ap.x - headX) < 7 * u + ap.r && ap.y > headY - ap.r && ap.y < headY + 10 * u) {
          ap.hit = true;
          c.state = 'bonk'; c.bonk = 1.1;
          sfx('meowHurt');
          for (let k = 0; k < 4; k++) this.spawnPart(ap.x, headY, crumb, -40, 140, rand(0.6, 1.0));
          this.fallApples.splice(i, 1);
          continue;
        }
        if (ap.y > hY + 2) { // 落地
          for (let k = 0; k < 3; k++) this.spawnPart(ap.x, hY, crumb, -30, 150, rand(0.5, 0.9));
          this.fallApples.splice(i, 1);
          continue;
        }
        if (ap.poop) {
          // 一坨屎：上小下大、带一点高光
          ctx.fillStyle = 'rgba(110,78,46,0.95)';
          ctx.beginPath(); ctx.ellipse(ap.x, ap.y + ap.r * 0.5, ap.r, ap.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ap.x, ap.y - ap.r * 0.3, ap.r * 0.62, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(150,116,78,0.8)';
          ctx.beginPath(); ctx.arc(ap.x - ap.r * 0.3, ap.y - ap.r * 0.4, ap.r * 0.22, 0, Math.PI * 2); ctx.fill();
        } else {
          // 苹果
          ctx.fillStyle = 'rgba(198,48,42,0.95)';
          ctx.beginPath(); ctx.arc(ap.x, ap.y, ap.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(96,70,46,0.9)'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(ap.x, ap.y - ap.r); ctx.lineTo(ap.x + 1.5, ap.y - ap.r - 3); ctx.stroke();
        }
      }
    },
    /* 造一只飞过的寒鸦（冬日） */
    makeDaw() {
      const dir = Math.random() < 0.5 ? 1 : -1;
      return {
        mode: 'fly', dir, x: dir > 0 ? -70 : W + 70,
        y: rand(H * 0.14, H * 0.30),
        vx: dir * rand(40, 58), phase: rand(0, 7),
        nextCaw: rand(1.8, 3.6), caws: 1 + (Math.random() < 0.5 ? 1 : 0),
      };
    },
    // 苹果树冠中心（与 tree() 内一致），用来定位树上的苹果
    canopyCenter() {
      const tr = this.tree0, R = tr.R, hY = this.horizon();
      return { x: tr.x, cy: (hY - R * 1.55) - R * 0.30, R };
    },
    /* 秋日两只胖鸟：一黑一粉，飞来各吃一颗苹果、各拉一坨屎、靠在一起歇会儿再一起飞走 */
    makeBirdPair() {
      const cc = this.canopyCenter(), tr = this.tree0, N = tr.apples.length;
      let i1 = Math.floor(rand(0, N));
      let i2 = (i1 + 1 + Math.floor(rand(0, N - 1))) % N;
      const blackLeft = Math.random() < 0.5;
      const mk = (idx, color, fromLeft) => {
        const ap = tr.apples[idx];
        const ax = cc.x + ap.dx, ay = cc.cy + ap.dy;
        const side = fromLeft ? -1 : 1;
        return {
          color, appleIdx: idx, ax, ay,
          px: ax - side * tr.R * 0.17, py: ay - tr.R * 0.12,
          x: fromLeft ? -70 : W + 70, y: rand(H * 0.06, H * 0.18),
          sx: fromLeft ? -70 : W + 70, sy: rand(H * 0.06, H * 0.18),
          dir: fromLeft ? 1 : -1, faceDir: ax >= (ax - side * tr.R * 0.17) ? 1 : -1,
          phase: rand(0, 7), t: 0, dur: rand(1.8, 2.6),
          pecks: 10 + Math.floor(Math.random() * 5), lastPeck: -1, peck: 0,
          landed: false, done: false, pooped: false, vx: 0, vy: 0,
        };
      };
      return {
        phase: 'approach', t: 0,
        a: mk(i1, 'black', blackLeft),
        b: mk(i2, 'pink', !blackLeft),
      };
    },
    /* 一坨屎落下（可能砸到树下的猫，复用落物判定） */
    dropPoop(k) {
      const u = Math.min(W, H) * 0.0006;
      this.fallApples.push({
        x: k.px - k.faceDir * 8 * u, y: k.py + 9 * u,
        vx: rand(-6, 6), vy: 8, r: 3.4, poop: true, hit: false,
      });
    },
    stepBirdPair(dt, t) {
      const pr = this.birdPair, tr = this.tree0;
      const pair = [pr.a, pr.b];
      if (pr.phase === 'approach') {
        let allLanded = true;
        for (const k of pair) {
          if (k.landed) { this.drawCuteBird(k, t, 'perch'); continue; }
          k.t += dt; const p = Math.min(1, k.t / k.dur);
          k.x = lerp(k.sx, k.px, p);
          k.y = lerp(k.sy, k.py, p) - Math.sin(p * Math.PI) * Math.min(W, H) * 0.05;
          this.drawCuteBird(k, t, 'fly');
          if (p >= 1) { k.landed = true; k.t = 0; k.faceDir = k.ax >= k.px ? 1 : -1; this.eatenApples[k.appleIdx] = 0; }
          else allLanded = false;
        }
        if (allLanded) { pr.phase = 'eat'; }
      } else if (pr.phase === 'eat') {
        let allDone = true;
        for (const k of pair) {
          if (k.done) { this.drawCuteBird(k, t, 'perch'); continue; }
          allDone = false;
          k.t += dt;
          const cyc = 0.6;
          k.peck = Math.max(0, Math.sin(Math.PI * (k.t % cyc) / cyc));
          const pd = Math.floor(k.t / cyc);
          if (pd > k.lastPeck) {
            k.lastPeck = pd;
            if (pd >= 1) {
              this.eatenApples[k.appleIdx] = Math.min(1, pd / k.pecks);
              this.spawnPart(k.ax, k.ay, [198, 48, 42], -16, 130, rand(0.5, 0.9));
            }
          }
          this.drawCuteBird(k, t, 'peck');
          if (pd >= k.pecks) {
            k.done = true; this.eatenApples[k.appleIdx] = 1;
            if (!k.pooped) { k.pooped = true; this.dropPoop(k); }   // 吃完拉一坨
          }
        }
        if (allDone) {
          // 算出靠在一起的位置：两只苹果连线的中点附近，肩并肩
          const mx = (pr.a.px + pr.b.px) / 2, my = Math.min(pr.a.py, pr.b.py);
          const gap = tr.R * 0.13;
          pr.a.gx = mx - gap; pr.a.gy = my; pr.a.gFace = 1;   // 黑/粉就近排好，互相对望
          pr.b.gx = mx + gap; pr.b.gy = my; pr.b.gFace = -1;
          if (pr.a.px > pr.b.px) { pr.a.gx = mx + gap; pr.a.gFace = -1; pr.b.gx = mx - gap; pr.b.gFace = 1; }
          for (const k of pair) { k.gsx = k.px; k.gsy = k.py; k.t = 0; }
          pr.phase = 'gather'; pr.t = 0;
        }
      } else if (pr.phase === 'gather') {
        let arrived = true;
        for (const k of pair) {
          const p = Math.min(1, k.t / 0.9);
          k.x = lerp(k.gsx, k.gx, p);
          k.y = lerp(k.gsy, k.gy, p) - Math.sin(p * Math.PI) * 6;
          k.faceDir = k.gFace;
          k.t += dt;
          this.drawCuteBird(k, t, p < 1 ? 'fly' : 'perch');
          if (p < 1) arrived = false;
        }
        if (arrived) { pr.phase = 'snuggle'; pr.t = 0; }
      } else if (pr.phase === 'snuggle') {
        pr.t += dt;
        for (const k of pair) { k.faceDir = k.gFace; this.drawCuteBird(k, t, 'perch'); }
        // 头顶冒一颗小爱心
        const hx = (pr.a.gx + pr.b.gx) / 2, hy = Math.min(pr.a.gy, pr.b.gy) - 14;
        const ha = Math.min(1, pr.t / 0.5) * Math.max(0, 1 - (pr.t - 2.0)) * 0.7;
        if (ha > 0.02) this.heart(hx, hy - Math.min(pr.t, 1.2) * 6, 5, ha);
        if (pr.t > 3.0) {
          // 树在右侧，一起向右上方飞走（不再有重力，免得没飞出去就沉到地里）
          for (const k of pair) { k.dir = 1; k.vx = rand(55, 78); k.vy = -rand(26, 38); }
          pr.phase = 'leave';
        }
      } else {  // leave 一起飞走
        let gone = true;
        for (const k of pair) {
          k.x += k.vx * dt; k.y += k.vy * dt;
          this.drawCuteBird(k, t, 'fly');
          if (k.x < W + 90 && k.y > -80) gone = false;
        }
        if (gone) this.birdPair = null;
      }
    },
    heart(x, y, s, a) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s / 10, s / 10);
      ctx.fillStyle = `rgba(255,120,150,${a})`;
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-6, -4, -10, 2, 0, 9);
      ctx.bezierCurveTo(10, 2, 6, -4, 0, 3);
      ctx.fill(); ctx.restore();
    },
    /* 胖乎乎的可爱小鸟：圆团身子、大眼睛、小喙、小翅膀；color 'black' 或 'pink' */
    drawCuteBird(k, t, pose) {
      const dark = k.color === 'black';
      const u = Math.min(W, H) * 0.0013 * (dark ? 1.05 : 1);  // 黑鸟略放大，抵消亮色显大的错觉
      const d = pose === 'fly' ? k.dir : k.faceDir;
      const peck = pose === 'peck' ? k.peck : 0;
      const flap = Math.sin(t * 12 + k.phase);
      const yb = pose === 'fly' ? k.y + Math.sin(t * 1.6 + k.phase) * 5 : k.y;
      const body = dark ? 'rgba(58,58,66,0.97)' : 'rgba(244,148,178,0.97)';
      const belly = dark ? 'rgba(98,98,108,0.97)' : 'rgba(255,210,224,0.97)';
      const wing = dark ? 'rgba(40,40,48,0.97)' : 'rgba(226,116,156,0.97)';
      ctx.save(); ctx.translate(k.x, yb); ctx.scale(d, 1);
      // 小尾巴
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.moveTo(-8 * u, 1 * u); ctx.lineTo(-15 * u, -2 * u); ctx.lineTo(-14 * u, 4 * u); ctx.closePath(); ctx.fill();
      // 圆团身子
      ctx.beginPath(); ctx.ellipse(0, 1 * u, 11 * u, 10.5 * u, 0, 0, Math.PI * 2); ctx.fill();
      // 浅色肚子
      ctx.fillStyle = belly;
      ctx.beginPath(); ctx.ellipse(3 * u, 4 * u, 6 * u, 6.5 * u, 0, 0, Math.PI * 2); ctx.fill();
      // 翅膀
      ctx.fillStyle = wing;
      if (pose === 'fly') {
        ctx.beginPath(); ctx.moveTo(1 * u, -3 * u);
        ctx.quadraticCurveTo(-7 * u, (-13 - flap * 9) * u, -16 * u, (-6 - flap * 6) * u);
        ctx.quadraticCurveTo(-5 * u, 0, 2 * u, 1 * u); ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(2 * u, -3 * u);
        ctx.quadraticCurveTo(-8 * u, -1 * u, -10 * u, 6 * u);
        ctx.quadraticCurveTo(-3 * u, 2 * u, 3 * u, 1 * u); ctx.closePath(); ctx.fill();
      }
      // 头（和身子连成团），啄食时下沉
      const hx = (7 - peck * 1.5) * u, hy = (-7 + peck * 13) * u;
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(hx, hy, 6.6 * u, 0, Math.PI * 2); ctx.fill();
      // 小喙
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(peck * 0.5);
      ctx.fillStyle = 'rgba(244,176,72,0.98)';
      ctx.beginPath(); ctx.moveTo(5 * u, 0); ctx.lineTo(10 * u, 1.6 * u); ctx.lineTo(5 * u, 3 * u); ctx.closePath(); ctx.fill();
      ctx.restore();
      // 大眼睛
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 2 * u, hy - 1 * u, 2.7 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a20'; ctx.beginPath(); ctx.arc(hx + 2.9 * u, hy - 1 * u, 1.5 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(hx + 3.4 * u, hy - 1.7 * u, 0.6 * u, 0, Math.PI * 2); ctx.fill();
      // 腮红
      ctx.fillStyle = dark ? 'rgba(255,150,170,0.35)' : 'rgba(240,110,150,0.55)';
      ctx.beginPath(); ctx.arc(hx - 1 * u, hy + 2.2 * u, 1.8 * u, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    },
    /* 夏日小球员：走出门 → 垫球 → 带球短跑 → 蓄力一脚踢飞 → 腾空 → SIU 定格 → 跑出屏幕 */
    makeKid() {
      const m = Math.min(W, H);
      const doorX = W * 0.875 + m * 0.13 * 0.20;
      // 随机一件国家球衣（主色 + 短裤色）
      const kits = [
        { jersey: 'rgba(182,38,44,0.97)', shorts: 'rgba(40,70,52,0.95)' },   // 葡萄牙
        { jersey: 'rgba(40,72,160,0.97)', shorts: 'rgba(235,235,240,0.95)' }, // 法国
        { jersey: 'rgba(206,46,46,0.97)', shorts: 'rgba(40,52,90,0.95)' },    // 西班牙
        { jersey: 'rgba(242,132,40,0.97)', shorts: 'rgba(40,44,52,0.95)' },   // 荷兰
        { jersey: 'rgba(236,238,242,0.97)', shorts: 'rgba(40,44,52,0.95)' },  // 德国 / 英格兰
        { jersey: 'rgba(70,160,96,0.97)', shorts: 'rgba(236,238,242,0.95)' }, // 其它
        { jersey: 'rgba(222,32,40,0.97)', shorts: 'rgba(235,235,240,0.95)' }, // 中国（红衣白裤）
        { jersey: 'rgba(30,72,182,0.97)', shorts: 'rgba(30,72,182,0.95)' },   // 切尔西（全蓝）
      ];
      const kit = kits[Math.floor(Math.random() * kits.length)];
      return {
        state: 'out', t: 0,
        x: doorX, x0: doorX, jx: W * 0.56, outDur: 2.6,    // 走出来（慢一些）
        dribbleX: W * 0.40, dribDur: 1.5,                  // 带球到左半部分（不太靠边）
        spd: m * 0.085, run: 0, footRaise: 0,
        ballX: doorX - 14, ballY: 0, ballRot: 0,
        juggles: 3 + Math.floor(Math.random() * 3), jdone: -1,
        jersey: kit.jersey, shorts: kit.shorts,
        ballR: m * 0.0085,
      };
    },
    stepKid(dt, t) {
      const k = this.kid, g = this.horizon() + 1, u = Math.min(W, H) * 0.0011, m = Math.min(W, H);
      k.t += dt;
      // 被踢飞的球：划弧 → 落地连弹几下 → 弹不动了就贴地往前滚，直到滚出左边
      if (k.ballFlying) {
        k.ballX += k.ballVX * dt; k.ballY += k.ballVY * dt; k.ballVY += m * 1.1 * dt; k.ballRot -= k.ballVX * dt / k.ballR;
        if (k.ballY > g - k.ballR) {                       // 触地
          k.ballY = g - k.ballR;
          if (k.ballVY > m * 0.16) { k.ballVY = -k.ballVY * 0.58; k.ballVX *= 0.91; }  // 还有劲：弹起
          else { k.ballVY = 0; k.ballVX *= 0.992; }                                    // 弹不动了：贴地滚
        }
        this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot);
        if (k.ballX < -40) k.ballFlying = false;
      }
      if (k.state === 'out') {                 // 走出门、到垫球点
        const p = Math.min(1, k.t / k.outDur);
        k.x = lerp(k.x0, k.jx, p);
        k.run = Math.sin(t * 5.2);             // 走路：步频慢
        k.ballX = k.x - 13 * u; k.ballY = g - k.ballR; k.ballRot -= (k.jx - k.x0) / k.outDur * dt / k.ballR;
        this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot); this.drawKid(k, t, 'walk');
        if (p >= 1) { k.state = 'juggle'; k.t = 0; }
      } else if (k.state === 'juggle') {       // 脚上垫几下球
        const cyc = 0.6, ph = (k.t % cyc) / cyc;
        const bounce = Math.sin(Math.PI * ph);
        k.footRaise = Math.max(0, Math.cos(Math.PI * ph));
        k.ballX = k.x - 9 * u; k.ballY = g - 12 * u - bounce * 32 * u; k.ballRot += dt * 6;
        this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot); this.drawKid(k, t, 'juggle');
        if (Math.floor(k.t / cyc) >= k.juggles) { k.state = 'dribble'; k.t = 0; k.dribX0 = k.x; }
      } else if (k.state === 'dribble') {      // 短跑带几步球到左半部分
        const p = Math.min(1, k.t / k.dribDur);
        k.x = lerp(k.dribX0, k.dribbleX, p);
        k.run = Math.sin(t * 11);
        k.ballX = k.x - 16 * u; k.ballY = g - k.ballR; k.ballRot -= (k.dribX0 - k.dribbleX) / k.dribDur * dt / k.ballR * -1;
        this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot); this.drawKid(k, t, 'run');
        if (p >= 1) { k.state = 'winddup'; k.t = 0; }
      } else if (k.state === 'winddup') {      // 蓄力：踢腿向后拉
        k.ballX = k.x - 11 * u; k.ballY = g - k.ballR;
        this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot); this.drawKid(k, t, 'winddup');
        if (k.t > 0.45) { k.state = 'kick'; k.t = 0; }
      } else if (k.state === 'kick') {         // 起脚把球踢飞
        if (!k.ballFlying && !k.kicked) {
          if (k.t > 0.12) {                    // 触球瞬间，球飞出
            k.kicked = true; k.ballFlying = true;
            k.ballX = k.x - 12 * u; k.ballY = g - 11 * u;
            k.ballVX = -m * 0.29; k.ballVY = -m * 0.35;   // 较平的弧线，落地连弹三两下再滚出屏
          } else {
            k.ballX = k.x - 11 * u; k.ballY = g - k.ballR;
            this.drawBall(k.ballX, k.ballY, k.ballR, k.ballRot);
          }
        }
        this.drawKid(k, t, 'kick');
        if (k.t > 0.42) { k.state = 'siurun'; k.t = 0; }
      } else if (k.state === 'siurun') {       // 助跑两步
        k.x -= m * 0.05 * dt; k.run = Math.sin(t * 13);
        this.drawKid(k, t, 'run');
        if (k.t > 0.55) { k.state = 'jump'; k.t = 0; k.jumpX = k.x; }
      } else if (k.state === 'jump') {         // 腾空 + 转身
        const dur = 0.8, p = Math.min(1, k.t / dur);
        const yOff = -Math.sin(p * Math.PI) * 54 * u;
        const sq = 0.55 + 0.45 * Math.abs(Math.cos(p * Math.PI));     // 横向略压一下，暗示转身（不压成细线）
        k.x = k.jumpX - m * 0.025 * p;
        this.drawKidFront(k, t, { air: true, spread: 0.2, armOut: 8, armDown: -26, squashX: sq, yOff });
        if (p >= 1) {
          k.state = 'pose'; k.t = 0;
          for (let i = 0; i < 5; i++) this.spawnPart(k.x + rand(-6, 6), g, [214, 204, 188], -22, 90, rand(0.4, 0.7)); // 落地扬尘
        }
      } else if (k.state === 'pose') {         // SIUUU 定格
        this.drawKidFront(k, t, { air: false, spread: 1, armOut: 9, armDown: -13, shout: true });
        if (k.t > 1.7) { k.state = 'leave'; k.t = 0; }
      } else {                                 // 跑出左边（明显比出场快、步频更高）
        k.x -= m * 0.26 * dt; k.run = Math.sin(t * 17);
        this.drawKid(k, t, 'run');
        if (k.x < -40) this.kid = null;
      }
    },
    /* 2026 世界杯官方比赛球「Trionda」风格：白底、四片波浪панель、中心三色（红蓝绿）三角徽记 */
    drawBall(x, y, r, rot) {
      const TAU = Math.PI * 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      // 白色球身 + 轻微立体明暗
      const g = ctx.createRadialGradient(-r * 0.34, -r * 0.36, r * 0.1, 0, 0, r * 1.05);
      g.addColorStop(0, 'rgba(255,255,255,0.99)');
      g.addColorStop(1, 'rgba(206,214,224,0.99)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      // 限制在球内绘制纹样
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
      // 中心三色三角（红 / 蓝 / 绿，象征三个主办国）
      const cols = ['rgba(214,42,52,0.95)', 'rgba(34,92,206,0.95)', 'rgba(34,150,84,0.95)'];
      for (let i = 0; i < 3; i++) {
        const a0 = i / 3 * TAU - Math.PI / 2, a1 = (i + 1) / 3 * TAU - Math.PI / 2, am = (a0 + a1) / 2;
        ctx.fillStyle = cols[i];
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a0) * r * 0.5, Math.sin(a0) * r * 0.5);
        ctx.quadraticCurveTo(Math.cos(am) * r * 0.36, Math.sin(am) * r * 0.36, Math.cos(a1) * r * 0.5, Math.sin(a1) * r * 0.5);
        ctx.closePath(); ctx.fill();
      }
      // 四片波浪缝（从中心向外的弧线，呼应 “la ola” 海浪四片设计）
      ctx.strokeStyle = 'rgba(44,52,66,0.34)'; ctx.lineWidth = Math.max(0.5, r * 0.06); ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU - Math.PI / 2;
        const bx = Math.cos(a), by = Math.sin(a), px = -by, py = bx;
        ctx.beginPath();
        ctx.moveTo(bx * r * 0.5, by * r * 0.5);
        ctx.quadraticCurveTo((bx * 0.8 + px * 0.5) * r, (by * 0.8 + py * 0.5) * r, bx * r * 1.05, by * r * 1.05);
        ctx.stroke();
      }
      ctx.restore();
      // 高光 + 边缘
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(-r * 0.38, -r * 0.4, r * 0.16, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      ctx.restore();
    },
    /* 小小球员：圆头+发、球衣身子、细胳膊腿；面朝左（跑动方向） */
    drawKid(k, t, pose) {
      const u = Math.min(W, H) * 0.0011, g = this.horizon() + 1;
      ctx.save();
      ctx.translate(k.x, g);
      ctx.scale(-1, 1);   // 朝左
      const skin = 'rgba(247,212,180,0.97)';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // 腿（裸腿肤色）
      ctx.strokeStyle = skin; ctx.lineWidth = 2.8 * u;
      if (pose === 'juggle') {
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(-3 * u, 0); ctx.stroke();             // 支撑腿
        const fr = k.footRaise || 0;
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.quadraticCurveTo(7 * u, -12 * u, 9 * u, (-9 - fr * 4) * u); ctx.stroke(); // 垫球腿
      } else if (pose === 'kick') {
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(-3 * u, 0); ctx.stroke();             // 支撑腿
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(12 * u, -4 * u); ctx.stroke();          // 抬起踢出的腿
      } else if (pose === 'winddup') {
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(2 * u, 0); ctx.stroke();               // 支撑腿
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(-9 * u, -3 * u); ctx.stroke();          // 踢腿向后拉（蓄力）
      } else {                                  // walk / run
        const amp = pose === 'walk' ? 3.4 : 5.4;
        const s = (k.run || 0) * amp;
        ctx.beginPath(); ctx.moveTo(0, -15 * u); ctx.lineTo(s * u, 0); ctx.moveTo(0, -15 * u); ctx.lineTo(-s * u, 0); ctx.stroke();
      }
      // 手臂：肩点在躯干顶端，肩→肘→手两段（肘部略弯）。近臂画在球衣之前、远臂在之后，
      //       走动时近臂在前、远臂在后地交替摆；远臂略淡略细以示纵深，避免两臂在中间重叠
      const shX = 0.6 * u, shY = -29.5 * u;        // 肩点
      let nSw, fSw;                                 // 近/远臂手部的前后位移
      if (pose === 'juggle' || pose === 'winddup' || pose === 'kick') {
        nSw = 8; fSw = -6;                          // 张臂保持平衡
      } else {                                      // walk / run：一前一后地摆
        const amp = pose === 'walk' ? 3.6 : 5.4;
        const s = (k.run || 0) * amp;
        nSw = s; fSw = -s;
      }
      const armPath = (sw, base) => {                // 肩→肘→手；base 为前后基准偏移（近臂略靠前、远臂略靠后，避免重叠）
        ctx.beginPath();
        ctx.moveTo(shX, shY);
        ctx.lineTo((base + sw * 0.45) * u, -22 * u); // 肘
        ctx.lineTo((base + sw) * u, -10 * u);        // 手（垂到大腿）
        ctx.stroke();
      };
      // 远臂（先画，会被短裤/球衣盖住一截）
      ctx.strokeStyle = 'rgba(226,190,158,0.85)'; ctx.lineWidth = 2.1 * u; armPath(fSw, -0.8);
      // 短裤（球衣同款国家色）
      ctx.fillStyle = k.shorts || 'rgba(60,52,46,0.92)';
      ctx.beginPath();
      ctx.moveTo(-4.5 * u, -18 * u); ctx.lineTo(4.5 * u, -18 * u); ctx.lineTo(5 * u, -12 * u);
      ctx.lineTo(0.5 * u, -13.5 * u); ctx.lineTo(-5 * u, -12 * u); ctx.closePath(); ctx.fill();
      // 身子（球衣）
      ctx.strokeStyle = k.jersey; ctx.lineWidth = 7.5 * u;
      ctx.beginPath(); ctx.moveTo(0, -17 * u); ctx.lineTo(1 * u, -30 * u); ctx.stroke();
      // 近臂（画在躯干之前）
      ctx.strokeStyle = skin; ctx.lineWidth = 2.6 * u; armPath(nSw, 0.8);
      // 头
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(1.5 * u, -36 * u, 5.5 * u, 0, Math.PI * 2); ctx.fill();
      // 头发
      ctx.fillStyle = 'rgba(58,42,32,0.96)';
      ctx.beginPath(); ctx.arc(1.5 * u, -37.5 * u, 5.6 * u, Math.PI * 1.02, Math.PI * 2.05); ctx.fill();
      ctx.beginPath(); ctx.arc(6 * u, -37 * u, 2 * u, Math.PI * 1.2, Math.PI * 2.2); ctx.fill();
      ctx.restore();
    },
    /* 正面的小球员：用于腾空转身与 SIU 定格（叉腿、双臂下张、仰头张嘴） */
    drawKidFront(k, t, o) {
      const u = Math.min(W, H) * 0.0011, g = this.horizon() + 1;
      const skin = 'rgba(247,212,180,0.97)';
      ctx.save();
      ctx.translate(k.x, g + (o.yOff || 0));
      ctx.scale(o.squashX != null ? o.squashX : 1, 1);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // 腿（裸腿肤色）
      ctx.strokeStyle = skin; ctx.lineWidth = 3 * u;
      if (o.air) {                              // 腾空：收腿
        ctx.beginPath(); ctx.moveTo(-2 * u, -16 * u); ctx.lineTo(-5 * u, -7 * u);
        ctx.moveTo(2 * u, -16 * u); ctx.lineTo(5 * u, -7 * u); ctx.stroke();
      } else {                                  // 定格：叉开站立
        const fx = (3 + o.spread * 7) * u;
        ctx.beginPath(); ctx.moveTo(-1.5 * u, -16 * u); ctx.lineTo(-fx, 0);
        ctx.moveTo(1.5 * u, -16 * u); ctx.lineTo(fx, 0); ctx.stroke();
      }
      // 短裤（国家色）
      ctx.fillStyle = k.shorts || 'rgba(60,52,46,0.92)';
      ctx.beginPath();
      ctx.moveTo(-5 * u, -19 * u); ctx.lineTo(5 * u, -19 * u); ctx.lineTo(5.5 * u, -13 * u);
      ctx.lineTo(0, -14.5 * u); ctx.lineTo(-5.5 * u, -13 * u); ctx.closePath(); ctx.fill();
      // 身子（球衣）
      ctx.strokeStyle = k.jersey; ctx.lineWidth = 8 * u;
      ctx.beginPath(); ctx.moveTo(0, -16 * u); ctx.lineTo(0, -30 * u); ctx.stroke();
      // 胳膊：从躯干两端（肩膀）伸出，SIU 是双臂笔直下张、攥拳
      ctx.strokeStyle = skin; ctx.lineWidth = 2.6 * u;
      const ax = o.armOut * u, ay = o.armDown * u, sh = 3.6 * u, shy = -29.5 * u;
      ctx.beginPath(); ctx.moveTo(-sh, shy); ctx.lineTo(-ax, ay); ctx.moveTo(sh, shy); ctx.lineTo(ax, ay); ctx.stroke();
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(-ax, ay, 1.9 * u, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ax, ay, 1.9 * u, 0, Math.PI * 2); ctx.fill();
      // 头（微微仰起）
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(0, -37 * u, 5.6 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(58,42,32,0.96)';
      ctx.beginPath(); ctx.arc(0, -39 * u, 5.7 * u, Math.PI, Math.PI * 2); ctx.fill();
      if (o.shout) {                            // 张嘴喊 SIU
        ctx.fillStyle = 'rgba(70,36,36,0.85)';
        ctx.beginPath(); ctx.ellipse(0, -34.5 * u, 1.4 * u, 2.1 * u, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    },
    /* 偏卡通的寒鸦：胖身子、大头、大眼珠、灰颈，扇动翅膀飞过 */
    drawDaw(k, t) {
      const u = Math.min(W, H) * 0.00102;  // 小一些的远空小鸟
      const d = k.dir;
      const flap = Math.sin(t * 11 + k.phase);          // 扇翅
      const yb = k.y + Math.sin(t * 1.6 + k.phase) * 6;  // 飞行起伏
      ctx.save();
      ctx.translate(k.x, yb);
      ctx.scale(d, 1);
      const body = 'rgba(46,48,54,0.96)', nape = 'rgba(120,124,134,0.96)';
      // 尾
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(-12 * u, 0); ctx.lineTo(-22 * u, -4 * u); ctx.lineTo(-21 * u, 3 * u);
      ctx.closePath(); ctx.fill();
      // 胖身子
      ctx.beginPath(); ctx.ellipse(-2 * u, 0, 13 * u, 9 * u, 0, 0, Math.PI * 2); ctx.fill();
      // 后翅（远）
      ctx.fillStyle = 'rgba(34,36,42,0.96)';
      ctx.beginPath();
      ctx.moveTo(-3 * u, -1 * u);
      ctx.quadraticCurveTo(-12 * u, (-10 - flap * 8) * u, -22 * u, (-4 - flap * 5) * u);
      ctx.quadraticCurveTo(-12 * u, -1 * u, -3 * u, 2 * u);
      ctx.closePath(); ctx.fill();
      // 大头
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(11 * u, -5 * u, 8 * u, 0, Math.PI * 2); ctx.fill();
      // 灰颈（寒鸦特征）
      ctx.fillStyle = nape;
      ctx.beginPath(); ctx.arc(7 * u, -3 * u, 6 * u, -0.4, 1.8); ctx.fill();
      // 喙
      ctx.fillStyle = 'rgba(28,28,32,0.96)';
      ctx.beginPath();
      ctx.moveTo(18 * u, -5 * u); ctx.lineTo(26 * u, -3.5 * u); ctx.lineTo(18 * u, -2 * u);
      ctx.closePath(); ctx.fill();
      // 大眼珠（卡通）
      ctx.fillStyle = '#f4f1e8';
      ctx.beginPath(); ctx.arc(13 * u, -6 * u, 3.4 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a20';
      ctx.beginPath(); ctx.arc(14.2 * u, -6 * u, 1.7 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(14.8 * u, -6.8 * u, 0.6 * u, 0, Math.PI * 2); ctx.fill();
      // 前翅（近，盖在身上）
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(0, -2 * u);
      ctx.quadraticCurveTo(-8 * u, (-14 - flap * 12) * u, -18 * u, (-8 - flap * 9) * u);
      ctx.quadraticCurveTo(-7 * u, 0, 2 * u, 1 * u);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    spawnPart(x, y, c, vy0, g, dur, spread = 40) {
      if (this.parts.length > 90) this.parts.shift();
      this.parts.push({
        x, y,
        vx: rand(-spread, spread) * 0.5 + this.farmDir * spread * 0.25,
        vy: vy0 + rand(-6, 6),
        g, r: rand(1.4, 2.6), phase: rand(0, 7), life: 0, dur,
        alpha: 0.85, c,
      });
    },
    draw(dt, t) {
      // 取正模：刚切入场景的第一帧，t 可能比 t0 早几毫秒
      const yp = (((t - this.t0) / this.YEAR) % 1 + 1) % 1;
      const st = farmState(yp);
      const si = st.si, k = st.sp;
      const nk = seasonNight(st.sp);
      this.lastNk = nk;
      this.lastSi = si;
      // 落果前后（秋天 sp 0.20~0.46），猫挑目标时有概率选到树下，自然溜达过去
      this.catLure = (si === 2 && st.sp >= 0.20 && st.sp <= 0.46) ? 0.40 : 0;
      // 秋天：一黑一粉两只胖鸟飞来吃苹果；冬天：约三成有一只寒鸦飞过天空
      if (si !== 2) { this.eatenApples = {}; this.birdPair = null; }
      if (si === 2) {                          // 秋：一黑一粉两只胖鸟飞来吃苹果（果子还在树上时）
        this.winterRolled = false;
        if (!this.autumnRolled && st.sp > 0.05) {
          this.autumnRolled = true;
          // 只有在入秋够早（果子还满树、来得及吃完）时才安排；若是中途切进来、秋天已过半，就不安排，免得鸟落在光秃秃的树上
          this.pairSpawnT = (st.sp < 0.15 && Math.random() < 0.30) ? t + rand(2, 5) : Infinity;  // 约三成的秋天出现
        }
        if (t >= this.pairSpawnT && !this.birdPair) {
          // 到点才真正飞来；但若此刻果子已开始被收走（后台休眠导致时间跳到秋深），就取消，免得落到空树上
          if (st.sp < 0.25) this.birdPair = this.makeBirdPair();
          this.pairSpawnT = Infinity;
        }
      } else if (si === 3) {                   // 冬：飞过天空
        this.autumnRolled = false;
        if (!this.winterRolled) {
          this.winterRolled = true;
          this.dawSpawnT = (Math.random() < 0.30) ? t + rand(10, 24) : Infinity;
        }
        if (t >= this.dawSpawnT && !this.daw) { this.daw = this.makeDaw(); this.dawSpawnT = Infinity; }
      } else { this.winterRolled = false; this.autumnRolled = false; this.daw = null; this.dawSpawnT = Infinity; }
      // 夏天：小朋友从屋里跑出来踢球
      if (si === 1) {
        if (!this.kidRolled && st.sp > 0.10 && st.sp < 0.55) {
          this.kidRolled = true;
          this.kidSpawnT = (Math.random() < 0.30) ? t + rand(1, 4) : Infinity;  // 约三成的夏天出现
        }
        if (t >= this.kidSpawnT && !this.kid) { this.kid = this.makeKid(); this.kidSpawnT = Infinity; }
      } else { this.kidRolled = false; this.kid = null; }
      const A = SEASONS[si], B = SEASONS[(si + 1) % 4];
      const hY = this.horizon();
      // 天色与土色：季节之间过渡，再压上夜色
      const skyT = lerpC(lerpC(A.sky[0], B.sky[0], k), [10, 14, 34], nk * 0.92);
      const skyB = lerpC(lerpC(A.sky[1], B.sky[1], k), [24, 32, 58], nk * 0.92);
      const soilT = lerpC(lerpC(A.soil[0], B.soil[0], k), [20, 18, 26], nk * 0.72);
      const soilB = lerpC(lerpC(A.soil[1], B.soil[1], k), [14, 12, 18], nk * 0.72);

      bgGradient([[0, rgb(skyT)], [hY / H, rgb(skyB)], [1, rgb(skyB)]]);

      // 夜空：星与月牙
      if (nk > 0.03) {
        for (const s of this.skyStars) {
          const tw = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.blink + s.phase))) * nk;
          ctx.fillStyle = `rgba(235,240,255,${tw})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }
        const mx = W * 0.30, my = H * 0.16, mr = Math.min(W, H) * 0.026;
        const ph = this.moonPh;
        // 被照亮的比例：0 新月 → 1 满月（留一丝月牙避免完全消失）；渐盈亮面在右、渐亏在左
        const ill = Math.max(0.06, ph < 0.5 ? ph * 2 : (1 - ph) * 2);
        const dir = ph < 0.5 ? -1 : 1;
        // 月光柔晕：满月更亮、月牙更淡
        const glow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 5);
        glow.addColorStop(0, `rgba(220,230,255,${0.22 * nk * (0.3 + 0.7 * ill)})`);
        glow.addColorStop(1, 'rgba(220,230,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(mx, my, mr * 5, 0, Math.PI * 2); ctx.fill();
        // 月面
        ctx.fillStyle = `rgba(235,240,250,${0.9 * nk})`;
        ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
        // 在月面内用天空色画一个偏移圆作阴影，得到正确的盈亏形状
        ctx.save();
        ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = rgb(skyT);
        ctx.beginPath(); ctx.arc(mx + dir * ill * 2.3 * mr, my - mr * 0.10, mr * 1.02, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 暖阳（冬天偏冷，入夜隐去）
      const dayA = 1 - nk;
      if (dayA > 0.03) {
        const sunX = W * 0.74, sunY = H * 0.20;
        const warm = si === 3 ? 0.5 : 1;
        const sr = Math.min(W, H) * 0.045;
        const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sr * 5);
        glow.addColorStop(0, `rgba(255,${230 - (1 - warm) * 40 | 0},${180 + (1 - warm) * 30 | 0},${(0.5 * warm + 0.2) * dayA})`);
        glow.addColorStop(1, 'rgba(255,230,180,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(255,${248 - (1 - warm) * 30 | 0},${225 - (1 - warm) * 20 | 0},${dayA})`;
        ctx.beginPath(); ctx.arc(sunX, sunY, sr, 0, Math.PI * 2); ctx.fill();
      }

      // 远山
      ctx.fillStyle = rgb(lerpC(skyB, [60, 84, 80], 0.32));
      ctx.beginPath();
      ctx.moveTo(0, hY);
      for (let x = 0; x <= W; x += 8) {
        ctx.lineTo(x, hY - 26 - Math.sin(x / W * 6.0) * 16 - Math.sin(x / W * 13) * 8);
      }
      ctx.lineTo(W, hY); ctx.closePath(); ctx.fill();

      // 薄薄一层田土
      const soil = ctx.createLinearGradient(0, hY, 0, H);
      soil.addColorStop(0, rgb(soilT));
      soil.addColorStop(1, rgb(soilB));
      ctx.fillStyle = soil;
      ctx.fillRect(0, hY, W, H - hY);
      ctx.strokeStyle = `rgba(0,0,0,${0.06 * (1 - st.snow)})`;
      ctx.lineWidth = 1;
      for (let r = 1; r <= 2; r++) {
        const ry = hY + (H - hY) * (r / 3);
        ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W, ry); ctx.stroke();
      }

      // 田边小屋与苹果树
      this.hut(nk, si, dt, st.snow);
      this.tree(si, st.sp, t, nk, dt);

      // 季节交替的整理：春来重新抽苗，谷垛只属于秋天
      if (si === 0) {
        for (const c of this.crops) c.cut = false;
        this.lastSheaf = -1;
      }
      if (si !== 2 && this.sheaves.length) this.sheaves = [];

      // 作物
      for (const c of this.crops) {
        c.grow += (st.g - c.grow) * Math.min(1, dt * 0.8);
        this.stalk(c, st.gold, t, nk);
        if (st.flowers > 0.3 && st.gold < 0.05 && c.grow > 0.45 && !c.cut && (c.x | 0) % 3 === 0) {
          const h = this.cropH() * c.grow * c.base;
          ctx.fillStyle = `rgba(255,235,245,${st.flowers * 0.9 * (1 - nk * 0.8)})`;
          ctx.beginPath();
          ctx.arc(c.x + Math.sin(t * 0.5 + c.sway) * 5 * c.grow + c.lean * h, hY - h - 2, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 草垛：收割后堆在地上的圆鼓草堆
      for (const sv of this.sheaves) {
        const sh = 1 - 0.5 * nk;
        const w = sv.s, hh = sv.s * 0.85;
        const x = sv.x;
        const grad = ctx.createLinearGradient(0, hY - hh, 0, hY);
        grad.addColorStop(0, `rgb(${226 * sh | 0},${190 * sh | 0},${104 * sh | 0})`);
        grad.addColorStop(1, `rgb(${176 * sh | 0},${134 * sh | 0},${60 * sh | 0})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x - w, hY);
        ctx.bezierCurveTo(x - w, hY - hh * 0.85, x - w * 0.55, hY - hh, x, hY - hh);
        ctx.bezierCurveTo(x + w * 0.55, hY - hh, x + w, hY - hh * 0.85, x + w, hY);
        ctx.closePath();
        ctx.fill();
        // 顶上的一小撮
        ctx.beginPath();
        ctx.ellipse(x + w * 0.05, hY - hh, w * 0.18, hh * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
        // 草秆纹理
        ctx.strokeStyle = `rgba(${150 * sh | 0},${112 * sh | 0},${50 * sh | 0},0.5)`;
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(x + i * w * 0.32, hY);
          ctx.quadraticCurveTo(x + i * w * 0.22, hY - hh * 0.6, x + i * w * 0.12, hY - hh * 0.92);
          ctx.stroke();
        }
      }

      // 积雪薄薄盖在田土上
      if (st.snow > 0.02) {
        const snC = lerpC([238, 242, 250], [70, 80, 110], nk * 0.8);
        ctx.fillStyle = `rgba(${snC[0]},${snC[1]},${snC[2]},${st.snow * 0.95})`;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, hY + 2);
        for (let x = 0; x <= W; x += 10) ctx.lineTo(x, hY - 2 + Math.sin(x / 37) * 2);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();
      }

      // 冬天的雪，时密时疏
      this.treeShake *= Math.exp(-3 * dt);
      if (si === 3) {
        this.treeSnow = Math.min(1, this.treeSnow + dt * 0.05);
        const inten = Math.max(0, 0.18 + 0.55 * Math.sin(t * 0.085 + this.snowPh) + 0.38 * Math.sin(t * 0.021 + this.snowPh * 2));
        if (Math.random() < dt * (2 + 26 * inten) && this.parts.length < 110) {
          this.parts.push({
            x: rand(0, W), y: -6, vx: rand(-8, 8), vy: rand(14, 30),
            g: 2, r: rand(1.2, 2.4), phase: rand(0, 7), life: 0, dur: rand(5, 8),
            alpha: 0.7, c: [240, 245, 252],
          });
        }
      } else {
        this.treeSnow = 1;
      }

      // 雪人
      this.snowman(si, st.sp, st.snow, nk, t);

      // 农人：日出而作，日落而息。匀速缓行，一季正好走完一趟
      this.farmDir = 1;
      let action = null, fx = 0;
      if (nk < 0.5) {
        if (si === 0 && st.sp > 0.04 && st.sp < 0.58) {         // 春：缓步撒种
          fx = W * (0.07 + 0.66 * (st.sp - 0.04) / 0.54); action = 'sow';
        } else if (si === 1 && st.sp > 0.04 && st.sp < 0.58) {  // 夏：缓步浇水
          fx = W * (0.07 + 0.66 * (st.sp - 0.04) / 0.54); action = 'water';
        } else if (si === 3 && st.sp > 0.06 && st.sp < 0.26) {  // 冬：慢慢踏雪出门
          fx = lerp(W * 0.80, W * 0.535, (st.sp - 0.06) / 0.20);
          this.farmDir = -1; action = 'walk';
        } else if (si === 3 && st.sp >= 0.26 && st.sp < 0.46) { // 冬：蹲在雪人边忙活
          fx = W * 0.535; this.farmDir = -1; action = 'build';
          if (Math.random() < dt * 4) {
            this.spawnPart(W * 0.50 + rand(-8, 8), hY - H * rand(0.01, 0.05), [240, 245, 252], -14, 60, rand(0.5, 0.9), 16);
          }
        } else if (si === 3 && st.sp >= 0.46 && st.sp < 0.50) { // 冬：站着欣赏一会儿
          fx = W * 0.545; this.farmDir = -1; action = 'stand';
        } else if (si === 3 && st.sp >= 0.50 && st.sp < 0.66) { // 冬：趁着暮色慢慢回屋
          fx = lerp(W * 0.545, W * 0.82, (st.sp - 0.50) / 0.16);
          this.farmDir = 1; action = 'walk';
        } else if (si === 2 && st.sp > 0.12 && st.sp < 0.62) {  // 秋：金浪铺满后开镰，只此一趟、贯穿整个白天
          const hp = (st.sp - 0.12) / 0.50;
          fx = W * (0.05 + 0.71 * hp);
          action = 'cut';
          for (const c of this.crops) {
            if (!c.cut && c.x < W * 0.76 && (c.x < fx - 6 || hp > 0.97)) {
              c.cut = true;
              const h = this.cropH() * c.grow * c.base;
              for (let i = 0; i < 2; i++) this.spawnPart(c.x, hY - h * 0.7, [232, 190, 92], -30, 130, rand(0.9, 1.4));
            }
          }
          // 沿途隔一段堆起一座草垛
          const seg = Math.floor((fx / W) * 7);
          if (seg > this.lastSheaf && seg >= 1 && seg <= 5) {
            this.lastSheaf = seg;
            this.sheaves.push({ x: W * (seg / 7) + rand(-10, 10), s: rand(H * 0.052, H * 0.075) });
          }
        }
      }
      if (action) {
        if (si !== 3) fx = Math.min(fx, W * 0.74);    // 农忙时走到田尽头便停下
        this.farmer(fx, t, nk, action);
        if (action === 'sow' && Math.random() < dt * 7) {
          this.spawnPart(fx + H * 0.022, hY - H * 0.04, [188, 158, 96], -16, 90, rand(0.8, 1.2));
        }
        if (action === 'water' && Math.random() < dt * 18) {
          this.spawnPart(fx + H * 0.028, hY - H * 0.03, [150, 198, 235], 4, 200, rand(0.5, 0.8), 18);
        }
      }

      // 布偶猫
      this.catStep(dt, t, nk);
      this.drawCat(t, nk);

      // 掉落的苹果（可能砸到树下的猫）
      this.stepApples(dt);

      // 夏天踢球的小朋友
      if (this.kid) this.stepKid(dt, t);

      // 秋天的两只胖鸟（吃苹果）
      if (this.birdPair) {
        if (si !== 2) this.birdPair = null;
        else this.stepBirdPair(dt, t);
      }
      // 冬天的寒鸦（飞过）
      if (this.daw) {
        const k = this.daw;
        if (si !== 3) { this.daw = null; }
        else {
          k.x += k.vx * dt;
          if (k.caws > 0) {
            k.nextCaw -= dt;
            if (k.nextCaw <= 0) { k.nextCaw = rand(2.2, 4); k.caws--; sfx('caw'); }
          }
          this.drawDaw(k, t);
          if (k.x < -90 || k.x > W + 90) this.daw = null;
        }
      }

      // 飘浮的颗粒（花瓣 / 谷粒 / 水滴 / 雪）
      for (let i = this.parts.length - 1; i >= 0; i--) {
        const p = this.parts[i];
        p.life += dt;
        if (p.life >= p.dur || p.y > H + 6) { this.parts.splice(i, 1); continue; }
        p.vy += p.g * dt;
        p.x += (p.vx + Math.sin(p.life * 2 + p.phase) * 10) * dt;
        p.y += p.vy * dt;
        const a = (1 - p.life / p.dur) * p.alpha;
        ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a})`;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.r, p.r * 0.65, p.life * 3 + p.phase, 0, Math.PI * 2);
        ctx.fill();
      }

      // 春夏的白天，偶尔有蝴蝶自己飞进田里（自动最多 6 只，点击最多加到 9 只）
      if (nk < 0.45 && (si === 1 || (si === 0 && st.sp > 0.30))
          && this.flutters.length < 6 && Math.random() < dt * 0.18) {
        const fromLeft = Math.random() < 0.5;
        this.spawnButterfly(
          fromLeft ? -20 : W + 20,
          hY - rand(H * 0.04, H * 0.18),
          (fromLeft ? 1 : -1) * rand(18, 34)
        );
      }
      // 蝴蝶
      for (let i = this.flutters.length - 1; i >= 0; i--) {
        const b = this.flutters[i];
        b.life += dt;
        if (b.life >= b.dur || b.x < -40 || b.x > W + 40) { this.flutters.splice(i, 1); continue; }
        b.x += b.vx * dt;
        b.y += Math.sin(b.life * 2.5 + b.phase) * 22 * dt;
        if (b.scared) b.y -= 30 * dt;                  // 被猫扑过，边飞边升高
        const wing = (Math.abs(Math.sin(b.life * 11)) * 4.5 + 1.5) * (b.size || 1);
        const a = Math.min(1, b.dur - b.life, 0.3 + b.life) * 0.9 * (1 - nk * 0.5);
        for (const sgn of [-1, 1]) {
          // 后翅（主色）
          ctx.fillStyle = `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${a})`;
          ctx.beginPath();
          ctx.ellipse(b.x + sgn * wing * 0.7, b.y + wing * 0.2, wing, wing * 1.3, sgn * 0.5, 0, Math.PI * 2);
          ctx.fill();
          // 前翅（花蝴蝶的第二种颜色）与翅尖小白点
          if (b.c2) {
            ctx.fillStyle = `rgba(${b.c2[0]},${b.c2[1]},${b.c2[2]},${a})`;
            ctx.beginPath();
            ctx.ellipse(b.x + sgn * wing * 0.8, b.y - wing * 0.75, wing * 0.72, wing * 0.95, sgn * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = `rgba(255,255,255,${a * 0.55})`;
            ctx.beginPath();
            ctx.arc(b.x + sgn * wing * 1.1, b.y - wing * 0.95, wing * 0.18, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        // 身体
        ctx.strokeStyle = `rgba(70, 58, 48, ${a})`;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - wing * 0.7);
        ctx.lineTo(b.x, b.y + wing * 0.7);
        ctx.stroke();
      }

      // 角落里淡淡的季节字
      ctx.textAlign = 'left';
      ctx.fillStyle = `rgba(255,255,255,${0.16 - nk * 0.06})`;
      ctx.font = `300 ${Math.min(W, H) * 0.14}px "PingFang SC","Microsoft YaHei",serif`;
      ctx.fillText(SEASONS[si].name, 28, H - 24);
    },
    tap(x, y) {
      const yp = (((performance.now() / 1000 - this.t0) / this.YEAR) % 1 + 1) % 1;
      const st = farmState(yp);
      const hY = this.horizon();
      // 冬天点苹果树：枝桠一抖，落下一蓬雪
      const tr0 = this.tree0;
      if (st.si === 3 && st.snow > 0.15 && Math.abs(x - tr0.x) < tr0.R * 1.5
          && y > hY - tr0.R * 3.4 && y < hY + 10) {
        this.shakeTree();
        return;
      }
      // 秋天：点到成熟的作物，亲手收割
      if (st.si === 2 && st.gold > 0.5) {
        let cutAny = false;
        for (const c of this.crops) {
          if (!c.cut && c.grow > 0.6 && Math.abs(c.x - x) < 36) {
            c.cut = true;
            cutAny = true;
            const h = this.cropH() * c.grow * c.base;
            for (let i = 0; i < 3; i++) this.spawnPart(c.x, hY - h * rand(0.4, 0.9), [232, 190, 92], -36, 130, rand(0.9, 1.5));
          }
        }
        if (cutAny) return;
      }
      // 其余时候：点哪儿就种下一株新苗（小屋边留空）
      if (!(x > W * 0.78 && x < W * 0.97)) {
        this.crops.push(this.seed(x, 0.02));
        if (this.crops.length > 170) this.crops.shift();
      }
      // 应季的小动静：春夏添一只蝴蝶、冬扬雪沫
      let col = [255, 235, 245], n = 6;
      if (st.si === 1 || (st.si === 0 && st.sp > 0.30)) {
        this.spawnButterfly(x, Math.min(y, hY - 24), (x < W / 2 ? 1 : -1) * rand(24, 40));
        col = [255, 240, 180]; n = 4;
      } else if (st.si === 3) { col = [240, 245, 252]; n = 7; }
      for (let i = 0; i < n; i++) {
        this.spawnPart(x + rand(-8, 8), (st.si === 3 ? y : hY) + rand(-6, 6), col, -22, 26, rand(1.4, 2.4));
      }
    },
    /* 种地：无背景风声；只在春夏秋的白天有远近成群的鸟鸣 */
    sound(A, out) {
      const self = this;
      let near = rand(3, 5), far = rand(1.5, 3);
      return {
        update(t) {
          const active = self.lastSi !== 3 && self.lastNk < 0.5;
          if (!active) return;
          if (t >= far) { far = t + rand(1.5, 3.5); A.bird(out, rand(0.6, 1)); }
          if (t >= near) { near = t + rand(3, 5); A.bird(out, rand(0, 0.4)); }
        },
      };
    },
  };

  /* ================= 场景管理与切换 ================= */
  const scenes = [fireflies, waves, stars, breath, snow, rain, daynight, farming];

  /* 按当地时间挑选初始场景 */
  function sceneByHour(h) {
    const idx = name => scenes.findIndex(s => s.name === name);
    if (h >= 5 && h < 9) return idx('昼夜');   // 清晨：看日出
    if (h >= 9 && h < 16) return idx('海浪');  // 白天：海边
    if (h >= 16 && h < 19) return idx('昼夜'); // 傍晚：看日落
    if (h >= 19 && h < 22) return idx('萤火'); // 入夜：萤火虫
    return idx('星夜');                        // 深夜：星空
  }
  let current = sceneByHour(new Date().getHours());
  let switching = false;

  scenes.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.textContent = s.name;
    btn.addEventListener('click', () => switchTo(i));
    switcher.appendChild(btn);
  });
  const buttons = [...switcher.children];

  function setActive() {
    buttons.forEach((b, i) => b.classList.toggle('active', i === current));
  }

  function switchTo(i) {
    if (i === current || switching) return;
    switching = true;
    fadeEl.classList.add('on');
    setTimeout(() => {
      current = i;
      scenes[current].init();
      setActive();
      audio.play();
      fadeEl.classList.remove('on');
      switching = false;
    }, 700);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') switchTo((current + 1) % scenes.length);
    if (e.key === 'ArrowLeft') switchTo((current - 1 + scenes.length) % scenes.length);
  });

  /* 点击画面：交给当前场景做应景的小效果 */
  canvas.addEventListener('pointerdown', (e) => {
    if (switching) return;
    const s = scenes[current];
    if (s.tap) s.tap(e.clientX, e.clientY);
  });

  /* ================= 界面自动隐藏 ================= */
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
  }
  ['mousemove', 'touchstart', 'keydown', 'click'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true })
  );

  /* ================= 主循环 ================= */
  let last = performance.now();
  function loop(now) {
    // 标签页切回时 dt 可能很大，截断以避免动画跳跃
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    scenes[current].draw(dt, t);
    audio.update(t, dt);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  scenes[current].init();
  setActive();
  wake();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
